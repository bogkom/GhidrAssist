name: GA-02/03 one-hop direct CALL register-context source integrity
on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareDataflow.java'
      - 'src/main/java/ghidrassist/hardware/HardwareCallsiteRegisterFlow.java'
      - 'src/main/java/ghidrassist/hardware/GhidraHardwareFlowService.java'
      - 'src/test/java/ghidrassist/hardware/HardwareCallsiteRegisterFlowSelfTest.java'
      - '.github/workflows/ga02-interproc-callsite-register-flow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Per-CALL A/D constants, CFG branch convergence and fail-closed aliases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga02-callsite"
          javac --release 21 -d "$RUNNER_TEMP/ga02-callsite" \
            src/main/java/ghidrassist/hardware/HardwareDataflow.java \
            src/main/java/ghidrassist/hardware/HardwareCallsiteRegisterFlow.java \
            src/test/java/ghidrassist/hardware/HardwareCallsiteRegisterFlowSelfTest.java
          java -cp "$RUNNER_TEMP/ga02-callsite" \
            ghidrassist.hardware.HardwareCallsiteRegisterFlowSelfTest
