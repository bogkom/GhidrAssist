name: Build and publish GhidrAssist Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0-beta.1 or v0.1.0)'
        required: true
        type: string
      release_stage:
        description: 'Publish as prerelease until runtime-tested'
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - stable
  pull_request:
    paths:
      - '.github/workflows/publish-ghidra-release.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download verified Ghidra 12.1.4
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 \
            -o "$RUNNER_TEMP/ghidra.zip" \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_DIR=$(find "$RUNNER_TEMP/ghidra" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' -print -quit)
          test -n "$GHIDRA_DIR"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
      - name: Compile GhidrAssist extension
        shell: bash
        run: |
          set -euo pipefail
          "$GHIDRA_INSTALL_DIR/support/gradle/gradlew" \
            --no-daemon --stacktrace buildExtension
      - name: Verify release ZIP and produce checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip)
          if (( \${#packages[@]} != 1 )); then
            echo "::error::Expected one Ghidra 12.1.4 extension ZIP in dist/"
            exit 1
          fi
          unzip -tq "\${packages[0]}"
          (cd dist && sha256sum "$(basename "\${packages[0]}")" > SHA256SUMS.txt)
          ls -lh "\${packages[0]}" dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GhidrAssist-release-candidate-\${{ github.run_id }}
          path: |
            dist/ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: compile
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: GhidrAssist-release-candidate-\${{ github.run_id }}
          path: release-assets
      - name: Validate manual release request
        shell: bash
        env:
          RELEASE_VERSION: \${{ inputs.version }}
          RELEASE_STAGE: \${{ inputs.release_stage }}
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Use a version such as v0.1.0-beta.1 or v0.1.0"
            exit 1
          fi
          if [[ "$RELEASE_STAGE" != "prerelease" && "$RELEASE_STAGE" != "stable" ]]; then
            echo "::error::Unknown release stage"
            exit 1
          fi
          if [[ "$RELEASE_STAGE" == stable && "$RELEASE_VERSION" == *-* ]]; then
            echo "::error::Pre-release version suffix cannot be marked stable"
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::Release already exists; versions are immutable by policy"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$RELEASE_VERSION" | grep -q .; then
            echo "::error::Tag already exists"
            exit 1
          fi
          shopt -s nullglob
          files=(release-assets/ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip)
          if (( \${#files[@]} != 1 )) || [[ ! -f release-assets/SHA256SUMS.txt ]]; then
            echo "::error::Missing extension ZIP or SHA256SUMS"
            exit 1
          fi
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
      - name: Publish GitHub Release with verified ZIP
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
          RELEASE_VERSION: \${{ inputs.version }}
          RELEASE_STAGE: \${{ inputs.release_stage }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(release-assets/ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip)
          options=()
          if [[ "$RELEASE_STAGE" == prerelease ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_VERSION" \
            "\${packages[0]}" release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "GhidrAssist $RELEASE_VERSION (Ghidra 12.1.4)" \
            --generate-notes \
            "\${options[@]}"
