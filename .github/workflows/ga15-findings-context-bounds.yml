name: GA-15 bounded agent findings and context regressions
on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/agent/react/FindingsCache.java'
      - 'src/test/java/ghidrassist/agent/react/FindingsCacheBudgetSelfTest.java'
      - '.github/workflows/ga15-findings-context-bounds.yml'
  push:
    paths:
      - 'src/main/java/ghidrassist/agent/react/FindingsCache.java'
      - 'src/test/java/ghidrassist/agent/react/FindingsCacheBudgetSelfTest.java'
      - '.github/workflows/ga15-findings-context-bounds.yml'
  workflow_dispatch:
jobs:
  bounded-findings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile bounded agent evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga15"
          javac --release 21 -d "$RUNNER_TEMP/ga15" \
            src/main/java/ghidrassist/agent/react/FindingsCache.java \
            src/test/java/ghidrassist/agent/react/FindingsCacheBudgetSelfTest.java
      - name: Reject unbounded output, invalid views and stale numbering
        run: java -cp "$RUNNER_TEMP/ga15" ghidrassist.agent.react.FindingsCacheBudgetSelfTest
