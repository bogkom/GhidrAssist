name: GA-12 durable completed per-function CFG source integrity
on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareDataflow.java'
      - 'src/main/java/ghidrassist/hardware/HardwareFunctionResultCodec.java'
      - 'src/main/java/ghidrassist/hardware/HardwareDurableFunctionStages.java'
      - 'src/main/java/ghidrassist/hardware/HardwareFunctionStageCache.java'
      - 'src/test/java/ghidrassist/hardware/HardwareDurableFunctionStagesSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareCheckpointValueWitnessSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareRegisterJoinCheckpointSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareMmioVbrJoinCheckpointSelfTest.java'
      - '.github/workflows/hardware-durable-function-stages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test typed function codec, restart keys and corruption
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga12-func"
          javac --release 21 -d "$RUNNER_TEMP/ga12-func" \
            src/main/java/ghidrassist/hardware/HardwareDataflow.java \
            src/main/java/ghidrassist/hardware/HardwareStageEpochs.java \
            src/main/java/ghidrassist/hardware/HardwareFunctionStageCache.java \
            src/main/java/ghidrassist/hardware/HardwareDurableStageStore.java \
            src/main/java/ghidrassist/hardware/HardwareFunctionResultCodec.java \
            src/main/java/ghidrassist/hardware/HardwareFunctionProgressCodec.java \
            src/main/java/ghidrassist/hardware/HardwareDurableFunctionStages.java \
            src/test/java/ghidrassist/hardware/HardwareDurableFunctionStagesSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareCheckpointValueWitnessSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareRegisterJoinCheckpointSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareMmioVbrJoinCheckpointSelfTest.java
          java -cp "$RUNNER_TEMP/ga12-func" \
            ghidrassist.hardware.HardwareDurableFunctionStagesSelfTest
          java -cp "$RUNNER_TEMP/ga12-func" \
            ghidrassist.hardware.HardwareCheckpointValueWitnessSelfTest
          java -cp "$RUNNER_TEMP/ga12-func" \
            ghidrassist.hardware.HardwareRegisterJoinCheckpointSelfTest
          java -cp "$RUNNER_TEMP/ga12-func" \
            ghidrassist.hardware.HardwareMmioVbrJoinCheckpointSelfTest
