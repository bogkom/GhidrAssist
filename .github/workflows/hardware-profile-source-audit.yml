name: Hardware profile source coverage audit

on:
  push:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareProfileAudit.java'
      - 'src/main/java/ghidrassist/hardware/HardwareProfiles.java'
      - 'src/main/java/ghidrassist/hardware/HardwareInventoryService.java'
      - 'src/test/java/ghidrassist/hardware/HardwareProfileAuditSelfTest.java'
      - '.github/workflows/hardware-profile-source-audit.yml'
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareProfileAudit.java'
      - 'src/main/java/ghidrassist/hardware/HardwareProfiles.java'
      - 'src/main/java/ghidrassist/hardware/HardwareInventoryService.java'
      - 'src/test/java/ghidrassist/hardware/HardwareProfileAuditSelfTest.java'
      - '.github/workflows/hardware-profile-source-audit.yml'
  workflow_dispatch:

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile MCU profile metadata inspector
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga06"
          javac --release 21 -d "$RUNNER_TEMP/ga06" \
            src/main/java/ghidrassist/hardware/HardwareProfiles.java \
            src/main/java/ghidrassist/hardware/HardwareProfileAudit.java \
            src/test/java/ghidrassist/hardware/HardwareProfileAuditSelfTest.java
      - name: Verify source gaps and overlap guard
        run: java -cp "$RUNNER_TEMP/ga06" ghidrassist.hardware.HardwareProfileAuditSelfTest
