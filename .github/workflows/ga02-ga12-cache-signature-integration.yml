name: GA-02/03 plus GA-12 verified CALL checkpoint signature integration
on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareDataflow.java'
      - 'src/main/java/ghidrassist/hardware/HardwareFunctionStageCache.java'
      - 'src/main/java/ghidrassist/hardware/HardwareDurableFunctionStages.java'
      - 'src/main/java/ghidrassist/hardware/HardwareVerifiedBranchReturn.java'
      - 'src/test/java/ghidrassist/hardware/HardwareCallCheckpointIntegrationSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareCheckpointValueWitnessSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareRegisterJoinCheckpointSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareMmioVbrJoinCheckpointSelfTest.java'
      - '.github/workflows/ga02-ga12-cache-signature-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-verified-returns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prove cache key invalidates changed post-CALL outputs and partial worklist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga02-ga12"
          javac --release 21 -d "$RUNNER_TEMP/ga02-ga12" \
            src/main/java/ghidrassist/hardware/HardwareDataflow.java \
            src/main/java/ghidrassist/hardware/HardwareStageEpochs.java \
            src/main/java/ghidrassist/hardware/HardwareFunctionStageCache.java \
            src/main/java/ghidrassist/hardware/HardwareDurableStageStore.java \
            src/main/java/ghidrassist/hardware/HardwareFunctionResultCodec.java \
            src/main/java/ghidrassist/hardware/HardwareFunctionProgressCodec.java \
            src/main/java/ghidrassist/hardware/HardwareDurableFunctionStages.java \
            src/main/java/ghidrassist/hardware/HardwareInterproceduralMmEffects.java \
            src/main/java/ghidrassist/hardware/HardwareVerifiedLeafReturn.java \
            src/main/java/ghidrassist/hardware/HardwareVerifiedBranchReturn.java \
            src/main/java/ghidrassist/hardware/HardwareRegisterOperand.java \
            src/test/java/ghidrassist/hardware/HardwareCallCheckpointIntegrationSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareCheckpointValueWitnessSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareRegisterJoinCheckpointSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareMmioVbrJoinCheckpointSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareVerifiedLeafReturnSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareVerifiedBranchReturnSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareDataflowSliceSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareFunctionStageCacheSelfTest.java
          for test_class in \
            HardwareCallCheckpointIntegrationSelfTest \
            HardwareCheckpointValueWitnessSelfTest \
            HardwareRegisterJoinCheckpointSelfTest \
            HardwareMmioVbrJoinCheckpointSelfTest \
            HardwareVerifiedLeafReturnSelfTest \
            HardwareVerifiedBranchReturnSelfTest \
            HardwareDataflowSliceSelfTest \
            HardwareFunctionStageCacheSelfTest; do
            java -cp "$RUNNER_TEMP/ga02-ga12" \
              "ghidrassist.hardware.$test_class"
          done
