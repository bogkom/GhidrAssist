name: GA-08/13 legacy naming and pointer CSV safety

on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareNamingReview.java'
      - 'src/main/java/ghidrassist/hardware/HardwareFunctionNamingReview.java'
      - 'src/test/java/ghidrassist/hardware/HardwareNamingReviewSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareFunctionNamingReviewSelfTest.java'
      - 'src/main/java/ghidrassist/hardware/HardwarePointerRoleReview.java'
      - 'src/test/java/ghidrassist/hardware/HardwarePointerRoleReviewSelfTest.java'
      - '.github/workflows/hardware-naming-csv-safety.yml'
  push:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareNamingReview.java'
      - 'src/main/java/ghidrassist/hardware/HardwareFunctionNamingReview.java'
      - 'src/test/java/ghidrassist/hardware/HardwareNamingReviewSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareFunctionNamingReviewSelfTest.java'
      - 'src/main/java/ghidrassist/hardware/HardwarePointerRoleReview.java'
      - 'src/test/java/ghidrassist/hardware/HardwarePointerRoleReviewSelfTest.java'
      - '.github/workflows/hardware-naming-csv-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  naming-csv-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile standalone read-only naming review models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/naming"
          javac --release 21 -d "$RUNNER_TEMP/naming" \
            src/main/java/ghidrassist/hardware/ChipSelectModel.java \
            src/main/java/ghidrassist/hardware/HardwareNamingReview.java \
            src/main/java/ghidrassist/hardware/HardwareFunctionNamingReview.java \
            src/main/java/ghidrassist/hardware/HardwarePointerRoleReview.java \
            src/test/java/ghidrassist/hardware/HardwareNamingReviewSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareFunctionNamingReviewSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwarePointerRoleReviewSelfTest.java
      - name: Reject formula/oversize inputs in register, function and pointer review CSV
        shell: bash
        run: |
          set -euo pipefail
          java -cp "$RUNNER_TEMP/naming" \
            ghidrassist.hardware.HardwareNamingReviewSelfTest
          java -cp "$RUNNER_TEMP/naming" \
            ghidrassist.hardware.HardwareFunctionNamingReviewSelfTest
          java -cp "$RUNNER_TEMP/naming" \
            ghidrassist.hardware.HardwarePointerRoleReviewSelfTest
