name: Diagnose NXP PDF download access
on:
  push:
    branches: [fix/rag-nxp-404-recovery]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare NXP endpoints and download headers (no document logging)
        shell: bash
        run: |
          set +e
          for url in             'https://www.nxp.com/docs/en/user-guide/MC68332UM.pdf'             'https://www.nxp.com/docs/en/reference-manual/M68000PRM.pdf'             'https://www.nxp.com/docs/en/user-guide/MC68336376UM05.pdf'             'https://www.nxp.com.cn/docs/en/user-guide/MC68332UM.pdf'             'https://www.nxp.com/docs/en/data-sheet/MC68332TS.pdf'; do
            echo "URL: $url"
            for agent in 'GhidrAssist-RAG-Documentation/1.0' 'Mozilla/5.0 (X11; Linux x86_64; rv:134.0) Gecko/20100101 Firefox/134.0'; do
              echo -n "Agent: $agent => "
              curl --max-time 12 -Ls -A "$agent" -o /dev/null -w 'HTTP=%{http_code},CT=%{content_type},BYTES=%{size_download},FINAL=%{url_effective}\n' "$url"
            done
          done
          echo "Python stdlib:"
          python3 - <<'PY'
          import urllib.request
          u='https://www.nxp.com/docs/en/user-guide/MC68332UM.pdf'
          for agent in ['GhidrAssist-RAG-Documentation/1.0','Mozilla/5.0 (X11; Linux x86_64; rv:134.0) Gecko/20100101 Firefox/134.0']:
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':agent})
                  with urllib.request.urlopen(req,timeout=10) as r:
                      print(agent,r.status,r.headers.get('content-type'),r.url)
              except Exception as e:
                  print(agent,type(e).__name__,str(e)[:120])
          PY
