name: GA-15/18 real ReAct Ghidra tool through JSON-RPC and CLI

on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/agent/react/ReActOrchestrator.java'
      - 'src/main/java/ghidrassist/agent/react/AgenticEvidenceRegistry.java'
      - 'src/main/java/ghidrassist/automation/AutomationServer.java'
      - 'src/main/java/ghidrassist/agent/react/FindingsCache.java'
      - 'tests/codebrowser_harness/**'
      - 'tools/ghidrassist-agent'
      - 'src/main/java/ghidrassist/agent/react/AgenticReviewDraft.java'
      - 'src/main/java/ghidrassist/core/TabController.java'
      - 'src/main/java/ghidrassist/ui/tabs/QueryTab.java'
      - 'src/main/java/ghidrassist/ui/common/TaskToolPolicyPanel.java'
      - '.github/workflows/ga15-ga18-real-react-jsonrpc-cli-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-codebrowser-api-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install isolated display for genuine Ghidra CodeBrowser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth openbox
      - name: Download and SHA-256 verify genuine Ghidra 12.1.4 PUBLIC
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 -o "$RUNNER_TEMP/ghidra.zip" \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_DIR="$(find "$RUNNER_TEMP/ghidra" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' -print -quit)"
          test -n "$GHIDRA_DIR"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
      - name: Build installable GhidrAssist extension on Java 25
        shell: bash
        run: |
          set -euo pipefail
          "$GHIDRA_INSTALL_DIR/support/gradle/gradlew" --no-daemon buildExtension
          EXTENSION="$(find dist -maxdepth 1 -name 'ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip' -type f -print -quit)"
          test -s "$EXTENSION"
          unzip -tq "$EXTENSION"
          sha256sum "$EXTENSION" > "$RUNNER_TEMP/ga15-extension.sha256"
          echo "EXTENSION=$EXTENSION" >> "$GITHUB_ENV"
      - name: Actual synthetic CodeBrowser ReAct native tool + Bearer JSON-RPC + CLI + offline checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tests/codebrowser_harness/run.py \
            tests/codebrowser_harness/ga15_react_api_cli_controller.py \
            tools/ghidrassist-agent
          xvfb-run -a -s '-screen 0 1400x1050x24' \
            bash -c 'openbox --sm-disable >/dev/null 2>&1 & wm=$!; trap "kill $wm 2>/dev/null || true" EXIT; sleep 1; python3 tests/codebrowser_harness/run.py "$@"' ga15 \
              --ghidra "$GHIDRA_INSTALL_DIR" --java-home "$JAVA_HOME" \
              --extension-zip "$EXTENSION" \
              --output "$RUNNER_TEMP/ga15-real-react-e2e" \
              --automation-probe --agentic-react-probe --timeout 300
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"ga15-real-react-e2e"
          receipt=json.loads((root/"ga15-react-e2e.json").read_text())
          runtime=json.loads((root/"ga15-react-result.json").read_text())
          original=json.loads((root/"result.json").read_text())
          prior_cfg=json.loads((root/"ga12-interrupted-cfg-before-restart.json").read_text())
          recovered_cfg=json.loads((root/"ga12-interrupted-cfg-after-restart.json").read_text())
          assert prior_cfg["deliberately_cancelled"] and prior_cfg["partial_worklist_saved"],prior_cfg
          assert prior_cfg["partial_not_review_evidence"],prior_cfg
          for key in ("real_second_jvm","real_ghidra_program_reopened",
                      "source_identity_matches","partial_restored",
                      "cold_result_exact_match","indirect_mmio_static_evidence_retained",
                      "completed_stage_persisted","changed_input_refused",
                      "changed_analyzer_refused","changed_profile_refused",
                      "changed_language_refused","changed_cfg_refused",
                      "changed_budget_refused","no_production_apply"):
              assert recovered_cfg[key] is True,(key,recovered_cfg)
          assert prior_cfg["full_input_sha256"]==recovered_cfg["full_input_sha256"],recovered_cfg
          assert prior_cfg["import_sha256"]==recovered_cfg["import_sha256"],recovered_cfg
          print("GA-12 FIRST-JVM INTERRUPTED CFG -> SECOND-JVM VERIFIED FIXED POINT PASS")
          restarted=json.loads((root/"ga15-restarted-ghidra.json").read_text())
          for name in ("real_new_jvm","real_codebrowser_reopened",
                       "real_synthetic_program_reopened","import_sha256_verified",
                       "revision_compared","stale_run_registry_absent",
                       "old_review_draft_rejected","no_inherited_accept_all",
                       "no_inherited_task_policy","no_automatic_plan_or_model_run",
                       "new_review_still_required","wrong_program_refused",
              "new_review_started_only_after_import",
              "new_checkpoint_saved_in_new_jvm",
              "ga12_cfg_fixed_point_restored_after_restart"):
              assert restarted.get(name) is True,(name,restarted)
          assert isinstance(restarted["prior_program_revision"],int),restarted
          assert isinstance(restarted["reopened_program_revision"],int),restarted
          assert restarted["revision_identical"]==(
              restarted["prior_program_revision"]==
              restarted["reopened_program_revision"]),restarted
          print("GA-12 TRUE GHIDRA JVM RESTART + SAME SYNTHETIC PROGRAM + NO OLD GRANTS PASS")
          continued=json.loads((root/"ga15-post-restart-continuation.json").read_text())
          for key in ("new_review_from_saved_checkpoint",
                      "actual_approve_plan_button",
                      "native_readonly_tool_executed","new_react_success",
                      "distinct_new_run","new_checkpoint_created"):
              assert continued.get(key) is True,(key,continued)
          assert continued["fresh_chat_id"]>0,continued
          assert original["status"]=="PASSED_HARDWARE_AUTOMATION_V2",original
          for key in ("actual_ghidra_codebrowser","real_react_execution",
              "real_http_bearer_401","real_cli_in_progress",
              "real_cli_completed","source_revision_unchanged",
              "stale_run_and_revision_denied","checkpoint_no_overwrite",
              "offline_no_session_verify_and_read","tampered_offline_denied",
              "real_cli_resume_preflight_exact_source",
              "real_cli_resume_preflight_forged_row_denied",
              "real_cli_resume_preflight_stale_run_denied",
              "real_cli_resume_preflight_wrong_bearer_denied",
              "no_resume_without_new_review",
              "real_cli_new_review_draft_unapproved",
              "real_cli_review_draft_no_overwrite",
              "real_cli_forged_draft_source_denied",
              "real_ghidra_java_review_import_validated",
              "real_ghidra_java_forged_draft_denied",
              "real_gui_new_chat_id",
              "real_gui_old_grants_not_inherited",
              "real_gui_readonly_tool_limit_8",
              "real_gui_staged_no_model_run",
              "real_gui_source_program_unchanged",
              "second_independent_react_after_test_review",
              "second_react_real_readonly_tool",
              "second_react_new_registry_generation",
              "second_react_stale_checkpoint_denied",
              "second_react_new_policy_readonly",
              "second_react_no_firmware_mutation",
              "third_react_via_actual_swing_approve_button",
              "third_react_real_tool_and_terminal_success",
              "third_react_different_run_and_no_program_change"):
              assert receipt.get(key) is True,(key,receipt)
          independent=json.loads((root/"ga15-independent-result.json").read_text())
          assert independent["new_run_id"]!=independent["original_run"],independent
          assert independent["tool_calls"]==1,independent
          assert independent["fresh_policy_max_8"] and independent["previous_run_denied"],independent
          third=json.loads((root/"ga15-gui-approved-result.json").read_text())
          assert third["actual_swing_approve_button"] and third["terminal_success"],third
          assert third["one_real_native_readonly_tool"] and third["program_revision_unchanged"],third
          assert runtime["status"]=="SUCCESS" and runtime["tool_calls"]==1,runtime
          assert runtime["tool_succeeded"] is True,runtime
          assert receipt["model_or_oauth_used"] is False
          assert receipt["runtime_execution_verified"] is False
          assert receipt["genuine_llm_resumption_verified"] is False
          print("GA-15/18 REAL GHIDRA REACT + AUTHENTICATED RPC + EXTERNAL CLI PASS")
          PY
      - name: Offline checkpoint must persist across Ghidra process exit, never resume authority
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/ga15-real-react-e2e/ga15-react-local-evidence.json"
          # The CodeBrowser process has exited after the previous step; read
          # the saved evidence in separate CLI processes with no live session.
          python3 tools/ghidrassist-agent --session "$RUNNER_TEMP/missing-agentic-session.json"             agentic-verify --input "$RUNNER_TEMP/ga15-real-react-e2e/ga15-react-local-evidence.json"             > "$RUNNER_TEMP/ga15-offline-after-exit.json"
          python3 tools/ghidrassist-agent --session "$RUNNER_TEMP/missing-agentic-session.json"             agentic-read --input "$RUNNER_TEMP/ga15-real-react-e2e/ga15-react-local-evidence.json"             --offset 0 --limit 1 > "$RUNNER_TEMP/ga15-offline-rows-after-exit.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          verified=json.loads((p/"ga15-offline-after-exit.json").read_text())
          readable=json.loads((p/"ga15-offline-rows-after-exit.json").read_text())
          assert verified["verified"] is True and verified["complete"] is True,verified
          assert readable["offline"] is True and readable["read_only"] is True,readable
          assert len(readable["rows"])==1,readable
          # Verify BOTH old and post-restart checkpoints in independent
          # local CLI processes, with no live bearer/session.
          from subprocess import run
          new=p/"ga15-real-react-e2e"/"ga15-post-restart-checkpoint.json"
          old=p/"ga15-real-react-e2e"/"ga15-react-local-evidence.json"
          assert new.is_file() and old.is_file(),new
          client=Path("tools/ghidrassist-agent")
          def invoke(action,source):
              result=run(["python3",str(client),"--session",
                  str(p/"no-agentic-session.json"),action,"--input",str(source)],
                  capture_output=True,text=True)
              assert result.returncode==0,(action,source,result.stderr)
              return json.loads(result.stdout)
          old_data=invoke("agentic-verify",old)
          new_data=invoke("agentic-verify",new)
          assert old_data["verified"] and old_data["complete"],old_data
          assert new_data["verified"] and new_data["complete"],new_data
          new_rows=invoke("agentic-read",new)
          old_rows=invoke("agentic-read",old)
          assert new_rows["run"]!=old_rows["run"],(old_rows,new_rows)
          assert new_rows["read_only"] and len(new_rows["rows"])>0,new_rows
          lineage=run(["python3",str(client),"--session",
              str(p/"no-agentic-session.json"),"agentic-lineage-verify",
              "--input",str(new),"--parent",str(old)],
              capture_output=True,text=True)
          assert lineage.returncode==0,lineage.stderr
          ancestry=json.loads(lineage.stdout)
          assert ancestry["lineage_matches"] and ancestry["read_only"],ancestry
          assert ancestry["new_independent_run"] and not ancestry["authorizes_apply"],ancestry
          assert ancestry["child_run"]==new_rows["run"],ancestry
          assert ancestry["parent_run"]==old_rows["run"],ancestry
          bad=run(["python3",str(client),"--session",
              str(p/"no-agentic-session.json"),"agentic-lineage-verify",
              "--input",str(new),"--parent",str(new)],
              capture_output=True,text=True)
          assert bad.returncode!=0,bad.stdout
          print("GA-12 FULL RESTART -> NEW REVIEW -> REAL NATIVE TOOL -> NEW CHECKPOINT PASS")
          print("GA-12 OFFLINE CHECKPOINT AFTER CODEBROWSER EXIT PASS")
          PY
          if python3 tools/ghidrassist-agent --session "$RUNNER_TEMP/missing-agentic-session.json"                agentic-resume-check --input "$RUNNER_TEMP/ga15-real-react-e2e/ga15-react-local-evidence.json"                >"$RUNNER_TEMP/ga15-illicit-resume.out" 2>&1; then
             echo "FAIL: offline checkpoint authorized a non-existing live program"
             exit 1
          fi
      - name: Bounded failure diagnostics
        if: failure()
        shell: bash
        run: |
          root="$RUNNER_TEMP/ga15-real-react-e2e"
          for file in "$root/compile.log" "$root/java.log" "$root/ga15-restart-java.log" "$root/ga12-interrupted-cfg-before-restart.json" "$root/ga12-interrupted-cfg-after-restart.json" "$root/ga15-restarted-ghidra.json" "$root/ga15-post-restart-continuation.json" "$root/ga15-react-controller.log" "$root/ga15-react-result.json"; do
            if test -f "$file"; then
              echo "=== $(basename "$file") ==="
              tail -n 75 "$file"
            fi
          done
      - name: Publish synthetic receipts only, no session token
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga15-real-react-jsonrpc-cli-${{ github.run_id }}
          path: ${{ runner.temp }}/ga15-real-react-e2e/
          if-no-files-found: ignore
          retention-days: 14
