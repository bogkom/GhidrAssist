name: GA12 isolated project copy source tests
on:
  push:
    branches:
      - 'work/ga12-isolated-project-snapshot-*'
      - 'work/ga12-persisted-analysis-witness-*'
      - 'work/ga12-label-tamper-calibration-*'
  pull_request:
    paths:
      - 'scripts/ga12-isolated-project-copy.py'
      - 'tests/test_ga12_isolated_project_copy.py'
      - 'tests/test_ga12_genuine_workflow_contract.py'
      - '.github/workflows/ga12-isolated-project-copy.yml'
      - 'scripts/ga12-genuine-reopen-smoke.sh'
      - 'ghidra_scripts/GA12VerifyRestoredProgram.java'
      - 'ghidra_scripts/GA12AuthorizedAnnotationCycle.java'
      - 'scripts/test-ga12-multi-annotation-contract.py'
jobs:
  source-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Java 21 toolchain
        run: |
          java -version
          javac -version
          test "$(javac -version 2>&1 | awk '{print $2}' | cut -d. -f1)" = 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python3 -m py_compile scripts/ga12-isolated-project-copy.py tests/test_ga12_isolated_project_copy.py
      - name: Validate genuine smoke shell syntax
        run: bash -n scripts/ga12-genuine-reopen-smoke.sh
      - name: Analysis-object persistence source contract
        run: python3 scripts/test-ga12-multi-annotation-contract.py
      - name: Positive and negative regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_ga12_isolated_project_copy.py' -v
          python3 -m unittest discover -s tests -p 'test_ga12_genuine_workflow_contract.py' -v

  genuine-project-reopen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve official Ghidra 12.1.4 PUBLIC asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              'https://api.github.com/repos/NationalSecurityAgency/ghidra/releases?per_page=100',
              headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'GhidrAssist-CI',
                       'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req, timeout=40) as response:
              releases = json.load(response)
          matches = [a for r in releases for a in r.get('assets', [])
                     if a['name'].startswith('ghidra_12.1.4_PUBLIC_') and a['name'].endswith('.zip')]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one pinned Ghidra asset, got {len(matches)}')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              print('GHIDRA_RELEASE_URL=' + matches[0]['browser_download_url'], file=out)
          PY
      - name: Install isolated official release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/ghidra.zip" "$GHIDRA_RELEASE_URL"
          sha256sum "$RUNNER_TEMP/ghidra.zip" | tee "$RUNNER_TEMP/ghidra.sha256"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP"
          ghidra_home="$(find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'ghidra_12.1.4_PUBLIC*' -print -quit)"
          test -x "$ghidra_home/support/analyzeHeadless"
          echo "GHIDRA_INSTALL_DIR=$ghidra_home" >> "$GITHUB_ENV"
      - name: Build full GhidrAssist extension with Java 25
        shell: bash
        run: |
          set -euo pipefail
          test "$(javac -version 2>&1 | awk '{print $2}' | cut -d. -f1)" = 25
          "$GHIDRA_INSTALL_DIR/support/gradle/gradlew" --no-daemon buildExtension
          mapfile -t zips < <(find dist -maxdepth 1 -type f -name '*.zip')
          test "${#zips[@]}" -eq 1
          unzip -Z1 "${zips[0]}" | grep -Eq '\\.jar$'
          sha256sum "${zips[0]}" | tee "$RUNNER_TEMP/ga12-extension.sha256"
          echo GA12_FULL_JAVA25_EXTENSION_BUILD_PASS
      - name: Genuine synthetic CPU32 import snapshot corruption rejection restore and reopen
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ga12-genuine-reopen-smoke.sh | tee "$RUNNER_TEMP/ga12-reopen.log"
          grep -Fxq 'GA12_CORRUPT_RESTORE_REJECTED' "$RUNNER_TEMP/ga12-reopen.log"
          grep -Fxq 'GA12_GENUINE_REOPEN_PASS' "$RUNNER_TEMP/ga12-reopen.log"
          for marker in GA12_UNAUTHORIZED_RESTORE_REJECTED GA12_REJECTED_RESEED_NONMUTATION_PASS GA12_TAMPER_DETECTION_PASS GA12_TAMPER_ISOLATION_PASS GA12_LABEL_TAMPER_DETECTION_PASS GA12_LABEL_TAMPER_ISOLATION_PASS GA12_UNAUTHORIZED_APPLY_NONMUTATION_PASS GA12_UNRELATED_ANALYSIS_REJECTION_NONMUTATION_PASS GA12_AUTHORIZED_PERSISTED_CYCLE_PASS GA12_DUPLICATE_APPLY_NONMUTATION_PASS GA12_DUPLICATE_ROLLBACK_NONMUTATION_PASS; do
            grep -Fxq "$marker" "$RUNNER_TEMP/ga12-reopen.log"
          done
          sha256sum "$RUNNER_TEMP/ga12-reopen.log" > "$RUNNER_TEMP/ga12-reopen.sha256"
      - name: Upload synthetic Ghidra execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga12-genuine-reopen-evidence
          path: |
            ${{ runner.temp }}/ga12-reopen.log
            ${{ runner.temp }}/ga12-reopen.sha256
            ${{ runner.temp }}/ghidra.sha256
            ${{ runner.temp }}/ga12-extension.sha256
          if-no-files-found: warn
