name: GA-10/16 official MC68332UM PDF source and folio verification
on:
  pull_request:
    paths:
      - '.github/workflows/ga10-ga16-official-mc68332-pdf.yml'
      - 'src/main/java/ghidrassist/hardware/HardwareProfiles.java'
      - 'src/main/java/ghidrassist/hardware/HardwareBitfieldSourceLedger.java'
      - 'docs/hardware-bitfield-evidence.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-manual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text/page tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Download publisher-hosted manual and verify immutable bytes
        shell: bash
        run: |
          set -euo pipefail
          pdf="$RUNNER_TEMP/MC68332UM.pdf"
          curl --fail --location --silent --show-error --retry 3 \
            --connect-timeout 20 --max-time 120 \
            'https://www.nxp.com/docs/en/user-guide/MC68332UM.pdf' -o "$pdf"
          test "$(head -c 5 "$pdf")" = '%PDF-'
          actual="$(sha256sum "$pdf" | cut -d' ' -f1)"
          echo "SOURCE_PDF_SHA256=$actual"
          # Initially UNKNOWN: pin the independently observed SHA-256 in
          # a reviewed follow-up commit. NEVER auto-accept a changed PDF.
          EXPECTED_SHA256="PENDING_MANUAL_VERIFICATION"
          if test "$actual" != "$EXPECTED_SHA256"; then
            echo "PDF digest requires an explicitly reviewed pin" >&2
            exit 1
          fi
          echo "MC68332_PDF=$pdf" >> "$GITHUB_ENV"
      - name: Verify exactly mapped physical PDF folios D-5/D-6/D-7
        shell: bash
        run: |
          set -euo pipefail
          pdf="$MC68332_PDF"
          pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
          test "$pages" = 265
          for page in 219 220 221; do
            pdftotext -f "$page" -l "$page" -layout "$pdf" "$RUNNER_TEMP/page-$page.txt"
            test -s "$RUNNER_TEMP/page-$page.txt"
          done
          grep -Fq 'SIMCR' "$RUNNER_TEMP/page-219.txt"
          grep -Fq 'SHEN' "$RUNNER_TEMP/page-219.txt"
          grep -Fq 'MM' "$RUNNER_TEMP/page-220.txt"
          grep -Fq 'SYNCR' "$RUNNER_TEMP/page-220.txt"
          grep -Fq 'STEXT' "$RUNNER_TEMP/page-221.txt"
          grep -Fq 'RSR' "$RUNNER_TEMP/page-221.txt"
          echo 'PHYSICAL_PDF_FOLIOS_219_220_221_PASS; no PDF bytes uploaded'
