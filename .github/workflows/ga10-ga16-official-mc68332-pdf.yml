name: GA-10/16 official MC68332UM PDF source and folio verification
on:
  pull_request:
    paths:
      - '.github/workflows/ga10-ga16-official-mc68332-pdf.yml'
      - 'src/main/java/ghidrassist/hardware/HardwareProfiles.java'
      - 'src/main/java/ghidrassist/hardware/HardwareBitfieldSourceLedger.java'
      - 'src/main/java/ghidrassist/hardware/HardwareBitfieldPageWitness.java'
      - 'src/main/java/ghidrassist/hardware/HardwareBitfieldLayoutWitness.java'
      - 'src/main/java/ghidrassist/hardware/HardwareManualFieldExcerptEvidence.java'
      - 'src/main/java/ghidrassist/hardware/HardwareManualPublisherExcerptPins.java'
      - 'src/test/java/ghidrassist/hardware/HardwareManualFieldExcerptEvidenceSelfTest.java'
      - 'src/main/java/ghidrassist/hardware/HardwareSimD2RegisterWitness.java'
      - 'src/test/java/ghidrassist/hardware/HardwareSimD2RegisterWitnessSelfTest.java'
      - 'src/main/java/ghidrassist/hardware/HardwareSimChipSelectTableWitness.java'
      - 'src/test/java/ghidrassist/hardware/HardwareSimChipSelectTableWitnessSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareBitfieldLayoutWitnessSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareBitfieldPageWitnessSelfTest.java'
      - 'docs/hardware-bitfield-evidence.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-manual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text/page tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download publisher-hosted manual and verify immutable bytes
        shell: bash
        run: |
          set -euo pipefail
          pdf="$RUNNER_TEMP/MC68332UM.pdf"
          curl --fail --location --silent --show-error --retry 3 \
            --connect-timeout 20 --max-time 120 \
            'https://www.nxp.com/docs/en/user-guide/MC68332UM.pdf' -o "$pdf"
          test "$(head -c 5 "$pdf")" = '%PDF-'
          actual="$(sha256sum "$pdf" | cut -d' ' -f1)"
          echo "SOURCE_PDF_SHA256=$actual"
          # Official SHA-256 observed on Actions run 42233497907; pin reviewed bytes in
          # a reviewed follow-up commit. NEVER auto-accept a changed PDF.
          EXPECTED_SHA256="02c2cb99738dd45a785798bba3e7dcc34bb0d54fb5fba42900e6ecb8356bf28a"
          # The runtime source ledger and publisher verification MUST agree.
          grep -Fq "$EXPECTED_SHA256" \
            src/main/java/ghidrassist/hardware/HardwareBitfieldSourceLedger.java
          if test "$actual" != "$EXPECTED_SHA256"; then
            echo "PDF digest requires an explicitly reviewed pin" >&2
            exit 1
          fi
          echo "MC68332_PDF=$pdf" >> "$GITHUB_ENV"
      - name: Verify exactly mapped physical PDF folios D-5/D-6/D-7
        shell: bash
        run: |
          set -euo pipefail
          pdf="$MC68332_PDF"
          pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
          test "$pages" = 265
          for page in 218 219 220 221; do
            pdftotext -f "$page" -l "$page" -layout "$pdf" "$RUNNER_TEMP/page-$page.txt"
            test -s "$RUNNER_TEMP/page-$page.txt"
          done
          grep -Fq 'SIMCR' "$RUNNER_TEMP/page-219.txt"
          grep -Fq 'SHEN' "$RUNNER_TEMP/page-219.txt"
          grep -Fq 'MM' "$RUNNER_TEMP/page-220.txt"
          grep -Fq 'SYNCR' "$RUNNER_TEMP/page-220.txt"
          grep -Fq 'STEXT' "$RUNNER_TEMP/page-221.txt"
          grep -Fq 'RSR' "$RUNNER_TEMP/page-221.txt"
          echo 'PHYSICAL_PDF_FOLIOS_219_220_221_PASS; no PDF bytes uploaded'
      - name: Verify per-field text matches explicitly claimed publisher PDF folios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mc68332-field-witness"
          javac --release 21 -d "$RUNNER_TEMP/mc68332-field-witness" \
            src/main/java/ghidrassist/hardware/HardwareProfiles.java \
            src/main/java/ghidrassist/hardware/ManualPdfPageClaim.java \
            src/main/java/ghidrassist/hardware/HardwareBitfieldSourceLedger.java \
            src/main/java/ghidrassist/hardware/HardwareBitfieldPageWitness.java \
            src/main/java/ghidrassist/hardware/HardwareBitfieldLayoutWitness.java \
            src/main/java/ghidrassist/hardware/HardwareManualFieldExcerptEvidence.java \
            src/main/java/ghidrassist/hardware/HardwareManualPublisherExcerptPins.java \
            src/main/java/ghidrassist/hardware/HardwareProfileAudit.java \
            src/main/java/ghidrassist/hardware/HardwareSimD2RegisterWitness.java \
            src/test/java/ghidrassist/hardware/HardwareSimD2RegisterWitnessSelfTest.java \
            src/main/java/ghidrassist/hardware/HardwareSimChipSelectTableWitness.java \
            src/test/java/ghidrassist/hardware/HardwareSimChipSelectTableWitnessSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareBitfieldLayoutWitnessSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareManualFieldExcerptEvidenceSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareBitfieldPageWitnessSelfTest.java
          java -cp "$RUNNER_TEMP/mc68332-field-witness" \
            ghidrassist.hardware.HardwareBitfieldPageWitnessSelfTest \
            "$RUNNER_TEMP/page-219.txt" \
            "$RUNNER_TEMP/page-220.txt" \
            "$RUNNER_TEMP/page-221.txt"
          echo 'PDF FIELD NAME TEXT SOURCE PASS; NOT A VERIFIED MASK OR RESET VALUE'
          # The SAME SHA-verified 265-page publisher PDF now also gates
          # exact extracted D-5/D-6 bit-diagram rows and a separate
          # manually reviewed 15-field mask-position reference.
          java -cp "$RUNNER_TEMP/mc68332-field-witness" \
            ghidrassist.hardware.HardwareBitfieldLayoutWitnessSelfTest \
            "$RUNNER_TEMP/page-219.txt" \
            "$RUNNER_TEMP/page-220.txt"
          echo 'REVIEWED DIAGRAM POSITION/MASK CLAIMS PASS; no MCU execution inferred'
          # All 26 reviewed chip-select register identities and 16-bit
          # addresses must match Table D-2 rows on the exact D-4/D-5
          # folio, not merely appear somewhere else in MC68332UM.
          java -cp "$RUNNER_TEMP/mc68332-field-witness" \
            ghidrassist.hardware.HardwareSimChipSelectTableWitnessSelfTest \
            "$RUNNER_TEMP/page-218.txt" \
            "$RUNNER_TEMP/page-219.txt"
          echo 'OFFICIAL MC68332UM TABLE D-2 CS REGISTER ADDRESS SOURCE PASS'

          java -cp "$RUNNER_TEMP/mc68332-field-witness" \
            ghidrassist.hardware.HardwareSimD2RegisterWitnessSelfTest \
            "$RUNNER_TEMP/page-218.txt" "$RUNNER_TEMP/page-219.txt"
          echo 'SIM D-2 REGISTER ROW/ACCESS/BYTE WIDTH PASS; no MM/CS execution inferred'

          # Independent source-content check: pinned original publisher
          # bytes and 265-page PDF were verified above before this point.
          # Unlike a bare field token, every one of the 15 profile fields
          # must have a reviewed heading and nearby meaning on the exact
          # description folio; the separate diagram still fixes bit masks.
          java -cp "$RUNNER_TEMP/mc68332-field-witness" \
            ghidrassist.hardware.HardwareManualFieldExcerptEvidenceSelfTest \
            "$RUNNER_TEMP/page-219.txt" "$RUNNER_TEMP/page-220.txt" \
            "$RUNNER_TEMP/page-221.txt"
          echo 'PINNED PUBLISHER PAGE+EDITION+EXCERPT 15-FIELD SOURCE PASS; source only'
