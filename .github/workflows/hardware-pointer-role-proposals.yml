name: Hardware pointer role proposals

on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwarePointerRoleReview.java'
      - 'src/main/java/ghidrassist/hardware/GhidraHardwareFlowService.java'
      - 'src/main/java/ghidrassist/hardware/HardwareInventoryService.java'
      - 'src/test/java/ghidrassist/hardware/HardwarePointerRoleReviewSelfTest.java'
      - '.github/workflows/hardware-pointer-role-proposals.yml'
  workflow_dispatch:

jobs:
  pointer-role:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile pure-Java role engine
        run: |
          mkdir -p "$RUNNER_TEMP/pointers"
          javac --release 21 -d "$RUNNER_TEMP/pointers" \
            src/main/java/ghidrassist/hardware/HardwarePointerRoleReview.java \
            src/test/java/ghidrassist/hardware/HardwarePointerRoleReviewSelfTest.java
      - name: Verify no automatic pointer naming
        run: java -cp "$RUNNER_TEMP/pointers" ghidrassist.hardware.HardwarePointerRoleReviewSelfTest
