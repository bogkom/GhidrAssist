name: MCP RAG evidence regression

on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/core/RAGQueryFocus.java'
      - 'src/main/java/ghidrassist/core/RAGExcerptSelector.java'
      - 'src/main/java/ghidrassist/hardware/McpEvidenceGuard.java'
      - 'src/test/java/ghidrassist/core/RAGQueryFocusSelfTest.java'
      - 'src/test/java/ghidrassist/core/RAGExcerptSelectorSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/McpEvidenceGuardSelfTest.java'
      - '.github/workflows/mcp-rag-evidence-tests.yml'
  workflow_dispatch:

jobs:
  pure-java-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile standalone source-evidence regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga-evidence-tests"
          javac --release 21 -d "$RUNNER_TEMP/ga-evidence-tests" \
            src/main/java/ghidrassist/core/RAGQueryFocus.java \
            src/main/java/ghidrassist/core/RAGExcerptSelector.java \
            src/main/java/ghidrassist/hardware/McpEvidenceGuard.java \
            src/test/java/ghidrassist/core/RAGQueryFocusSelfTest.java \
            src/test/java/ghidrassist/core/RAGExcerptSelectorSelfTest.java \
            src/test/java/ghidrassist/hardware/McpEvidenceGuardSelfTest.java
          java -cp "$RUNNER_TEMP/ga-evidence-tests" ghidrassist.core.RAGQueryFocusSelfTest
          java -cp "$RUNNER_TEMP/ga-evidence-tests" ghidrassist.core.RAGExcerptSelectorSelfTest
          java -cp "$RUNNER_TEMP/ga-evidence-tests" ghidrassist.hardware.McpEvidenceGuardSelfTest
