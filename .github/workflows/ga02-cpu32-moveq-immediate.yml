name: GA-02 CPU32 MOVEQ signed immediate source integrity
on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareRegisterOperand.java'
      - 'src/main/java/ghidrassist/hardware/GhidraHardwareFlowService.java'
      - 'src/test/java/ghidrassist/hardware/HardwareRegisterOperandSelfTest.java'
      - '.github/workflows/ga02-cpu32-moveq-immediate.yml'
  push:
    branches: [master]
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareRegisterOperand.java'
      - 'src/main/java/ghidrassist/hardware/GhidraHardwareFlowService.java'
      - 'src/test/java/ghidrassist/hardware/HardwareRegisterOperandSelfTest.java'
      - '.github/workflows/ga02-cpu32-moveq-immediate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile CPU32 immediate and exact register operand gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpu32-moveq"
          javac --release 21 -d "$RUNNER_TEMP/cpu32-moveq" \
            src/main/java/ghidrassist/hardware/HardwareRegisterOperand.java \
            src/test/java/ghidrassist/hardware/HardwareRegisterOperandSelfTest.java
      - name: Assert Ghidra signed MOVEQ without # remains strictly bounded
        shell: bash
        run: |
          set -euo pipefail
          java -cp "$RUNNER_TEMP/cpu32-moveq" ghidrassist.hardware.HardwareRegisterOperandSelfTest
