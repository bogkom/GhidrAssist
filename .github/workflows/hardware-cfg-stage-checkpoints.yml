name: Hardware completed-stage checkpoint regressions

on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareStageCheckpoint.java'
      - 'src/main/java/ghidrassist/hardware/HardwareFlowStageCache.java'
      - 'src/main/java/ghidrassist/hardware/HardwareInventoryService.java'
      - 'src/main/java/ghidrassist/ui/tabs/HardwareAnalysisTab.java'
      - 'src/test/java/ghidrassist/hardware/HardwareStageCheckpointSelfTest.java'
      - '.github/workflows/hardware-cfg-stage-checkpoints.yml'
  push:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareStageCheckpoint.java'
      - 'src/main/java/ghidrassist/hardware/HardwareFlowStageCache.java'
      - 'src/main/java/ghidrassist/hardware/HardwareInventoryService.java'
      - 'src/main/java/ghidrassist/ui/tabs/HardwareAnalysisTab.java'
      - 'src/test/java/ghidrassist/hardware/HardwareStageCheckpointSelfTest.java'
      - '.github/workflows/hardware-cfg-stage-checkpoints.yml'
  workflow_dispatch:

jobs:
  stage-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile immutable completed-stage checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          javac --release 21 -d "$RUNNER_TEMP/checkpoint" \
            src/main/java/ghidrassist/hardware/HardwareStageCheckpoint.java \
            src/test/java/ghidrassist/hardware/HardwareStageCheckpointSelfTest.java
      - name: Reject stale or incomplete stage reuse
        run: java -cp "$RUNNER_TEMP/checkpoint" ghidrassist.hardware.HardwareStageCheckpointSelfTest
