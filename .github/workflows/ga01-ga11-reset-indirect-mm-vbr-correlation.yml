name: GA-01/02/03/11 RESET indirect SIMCR MM and MOVEC source correlation
on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareResetIndirectVbrCorrelation.java'
      - 'src/main/java/ghidrassist/hardware/HardwareCfgSiteOrder.java'
      - 'src/main/java/ghidrassist/hardware/GhidraHardwareFlowService.java'
      - 'src/test/java/ghidrassist/hardware/HardwareResetIndirectVbrCorrelationSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareCfgSiteOrderSelfTest.java'
      - '.github/workflows/ga01-ga11-reset-indirect-mm-vbr-correlation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source-only RESET / indirect MM / MOVEC joint evidence and hard limits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga01-indirect-vbr"
          javac --release 21 -d "$RUNNER_TEMP/ga01-indirect-vbr" \
            src/main/java/ghidrassist/hardware/HardwareResetIndirectVbrCorrelation.java \
            src/main/java/ghidrassist/hardware/HardwareCfgSiteOrder.java \
            src/test/java/ghidrassist/hardware/HardwareResetIndirectVbrCorrelationSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareCfgSiteOrderSelfTest.java
          java -cp "$RUNNER_TEMP/ga01-indirect-vbr" \
            ghidrassist.hardware.HardwareResetIndirectVbrCorrelationSelfTest
          java -cp "$RUNNER_TEMP/ga01-indirect-vbr" \
            ghidrassist.hardware.HardwareCfgSiteOrderSelfTest
