name: GA-02/03 MC68332 CALL register-byte coverage metadata

on:
  push:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareRegisterByteCoverage.java'
      - 'src/main/java/ghidrassist/hardware/HardwareCallsiteRegisterFlow.java'
      - 'src/main/java/ghidrassist/hardware/HardwareTwoHopRegisterFlow.java'
      - 'src/main/java/ghidrassist/hardware/HardwareProfiles.java'
      - 'src/main/java/ghidrassist/hardware/HardwareDataflow.java'
      - 'src/main/java/ghidrassist/hardware/GhidraHardwareFlowService.java'
      - 'src/test/java/ghidrassist/hardware/HardwareRegisterByteCoverageSelfTest.java'
      - '.github/workflows/ga02-register-byte-coverage.yml'
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareRegisterByteCoverage.java'
      - 'src/main/java/ghidrassist/hardware/HardwareCallsiteRegisterFlow.java'
      - 'src/main/java/ghidrassist/hardware/HardwareTwoHopRegisterFlow.java'
      - 'src/main/java/ghidrassist/hardware/HardwareProfiles.java'
      - 'src/main/java/ghidrassist/hardware/HardwareDataflow.java'
      - 'src/main/java/ghidrassist/hardware/GhidraHardwareFlowService.java'
      - 'src/test/java/ghidrassist/hardware/HardwareRegisterByteCoverageSelfTest.java'
      - '.github/workflows/ga02-register-byte-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile deterministic MCU24 register byte-coverage gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga02-register-coverage"
          javac --release 21 -d "$RUNNER_TEMP/ga02-register-coverage" \
            src/main/java/ghidrassist/hardware/HardwareProfiles.java \
            src/main/java/ghidrassist/hardware/HardwareDataflow.java \
            src/main/java/ghidrassist/hardware/HardwareCallsiteRegisterFlow.java \
            src/main/java/ghidrassist/hardware/HardwareTwoHopRegisterFlow.java \
            src/main/java/ghidrassist/hardware/HardwareRegisterByteCoverage.java \
            src/test/java/ghidrassist/hardware/HardwareRegisterByteCoverageSelfTest.java
      - name: Verify exact/partial/spanning aliases and source-only CALL boundaries
        shell: bash
        run: |
          set -euo pipefail
          java -cp "$RUNNER_TEMP/ga02-register-coverage" \
            ghidrassist.hardware.HardwareRegisterByteCoverageSelfTest
