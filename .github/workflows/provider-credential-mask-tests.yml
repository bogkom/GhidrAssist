name: Provider credential masking regression

on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/ui/common/ProviderSecretField.java'
      - 'src/main/java/ghidrassist/ui/tabs/SettingsTab.java'
      - 'src/test/java/ghidrassist/ui/common/ProviderSecretFieldSelfTest.java'
      - '.github/workflows/provider-credential-mask-tests.yml'
  workflow_dispatch:

jobs:
  masked-by-default:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test Swing secret field in headless mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/provider-secret-field"
          javac --release 21 -d "$RUNNER_TEMP/provider-secret-field" \
            src/main/java/ghidrassist/ui/common/ProviderSecretField.java \
            src/test/java/ghidrassist/ui/common/ProviderSecretFieldSelfTest.java
          java -Djava.awt.headless=true -cp "$RUNNER_TEMP/provider-secret-field" \
            ghidrassist.ui.common.ProviderSecretFieldSelfTest
