name: Read-only MMIO accesses explorer tests

on:
  push:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareMmioExplorer.java'
      - 'src/test/java/ghidrassist/hardware/HardwareMmioExplorerSelfTest.java'
      - 'src/main/java/ghidrassist/ui/tabs/HardwareAnalysisTab.java'
      - '.github/workflows/hardware-mmio-explorer-tests.yml'
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareMmioExplorer.java'
      - 'src/test/java/ghidrassist/hardware/HardwareMmioExplorerSelfTest.java'
      - 'src/main/java/ghidrassist/ui/tabs/HardwareAnalysisTab.java'
      - '.github/workflows/hardware-mmio-explorer-tests.yml'
  workflow_dispatch:

jobs:
  explorer-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile pure-Java MMIO evidence view
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmio"
          javac --release 21 -d "$RUNNER_TEMP/mmio" \
            src/main/java/ghidrassist/hardware/HardwareMmioExplorer.java \
            src/test/java/ghidrassist/hardware/HardwareMmioExplorerSelfTest.java
      - name: Verify safe, bounded, source-only rows
        run: java -cp "$RUNNER_TEMP/mmio" ghidrassist.hardware.HardwareMmioExplorerSelfTest
