name: GA-02/03 CPU32 verified leaf return register summaries
on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareDataflow.java'
      - 'src/main/java/ghidrassist/hardware/HardwareVerifiedLeafReturn.java'
      - 'src/main/java/ghidrassist/hardware/GhidraHardwareFlowService.java'
      - 'src/test/java/ghidrassist/hardware/HardwareVerifiedLeafReturnSelfTest.java'
      - '.github/workflows/hardware-verified-leaf-returns.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-return-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify strict unconditional leaf returns and barrier hazards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga0203"
          javac --release 21 -d "$RUNNER_TEMP/ga0203" \
            src/main/java/ghidrassist/hardware/HardwareDataflow.java \
            src/main/java/ghidrassist/hardware/HardwareVerifiedLeafReturn.java \
            src/test/java/ghidrassist/hardware/HardwareVerifiedLeafReturnSelfTest.java
          java -cp "$RUNNER_TEMP/ga0203" \
            ghidrassist.hardware.HardwareVerifiedLeafReturnSelfTest
