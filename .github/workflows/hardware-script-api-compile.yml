name: Hardware scripts — Ghidra 12.1.4 API compilation

on:
  pull_request:
    paths:
      - 'ghidra_scripts/*.java'
      - 'ghidra_scripts/hardware_profiles.tsv'
      - '.github/workflows/hardware-script-api-compile.yml'
  workflow_dispatch:

jobs:
  compile-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Fetch and verify official Ghidra 12.1.4 release
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 \
            -o "$RUNNER_TEMP/ghidra.zip" \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
      - name: Compile standalone scripts against installed Ghidra API jars
        shell: bash
        run: |
          set -euo pipefail
          GHIDRA_DIR=$(find "$RUNNER_TEMP/ghidra" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' -print -quit)
          test -n "$GHIDRA_DIR"
          CLASSPATH=$(find "$GHIDRA_DIR" -name '*.jar' -type f -print | paste -sd ':' -)
          mkdir -p "$RUNNER_TEMP/ghidra-compiled-scripts"
          javac --release 25 -encoding UTF-8 \
            -cp "$CLASSPATH" \
            -d "$RUNNER_TEMP/ghidra-compiled-scripts" \
            ghidra_scripts/GhidrAssist_SIMCR_MM_Report.java \
            ghidra_scripts/GhidrAssist_ChipSelect_Map.java \
            ghidra_scripts/GhidrAssist_Pcode_Address_Probe.java \
            ghidra_scripts/GhidrAssist_Export_Hardware_Context.java
          echo "Standalone script API compilation passed"
