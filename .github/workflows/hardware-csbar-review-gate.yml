name: Hardware CSBAR Review/Apply source gate
on:
  push:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareCsbarReviewGate.java'
      - 'src/main/java/ghidrassist/ui/tabs/HardwareAnalysisTab.java'
      - 'src/test/java/ghidrassist/hardware/HardwareCsbarReviewGateSelfTest.java'
      - '.github/workflows/hardware-csbar-review-gate.yml'
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareCsbarReviewGate.java'
      - 'src/main/java/ghidrassist/ui/tabs/HardwareAnalysisTab.java'
      - 'src/test/java/ghidrassist/hardware/HardwareCsbarReviewGateSelfTest.java'
      - '.github/workflows/hardware-csbar-review-gate.yml'
  workflow_dispatch:
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile read-only Review evidence gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cs-review"
          javac --release 21 -d "$RUNNER_TEMP/cs-review" \
            src/main/java/ghidrassist/hardware/HardwareCsbarReviewGate.java \
            src/test/java/ghidrassist/hardware/HardwareCsbarReviewGateSelfTest.java
      - name: Reject MM0, conflicting and unknown CSBAR memory proposals
        run: java -cp "$RUNNER_TEMP/cs-review" ghidrassist.hardware.HardwareCsbarReviewGateSelfTest
