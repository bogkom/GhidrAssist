name: GA-05/08 review-only pointer variable identity and approval policy
on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareScopedVariableReview.java'
      - 'src/main/java/ghidrassist/hardware/HardwareScopedVariableService.java'
      - 'src/main/java/ghidrassist/hardware/HardwareScopedVariableReceipt.java'
      - 'src/test/java/ghidrassist/hardware/HardwareScopedVariableReceiptSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareScopedVariableReviewSelfTest.java'
      - 'tests/ga11_headless/Ga11VectorHeadlessMain.java'
      - '.github/workflows/ga05-ga08-scoped-variables.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pointer-review-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile isolated policy; no Ghidra project or firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/variables"
          javac --release 21 -d "$RUNNER_TEMP/variables" \
            src/main/java/ghidrassist/hardware/HardwareScopedVariableReview.java \
            src/main/java/ghidrassist/hardware/HardwareAnalysisRevision.java \
            src/main/java/ghidrassist/hardware/HardwareChangeProvenance.java \
            src/main/java/ghidrassist/hardware/HardwareScopedVariableReceipt.java \
            src/test/java/ghidrassist/hardware/HardwareScopedVariableReceiptSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareScopedVariableReviewSelfTest.java
      - name: Verify versioned variable receipts, revision race and corruption refusal
        run: java -cp "$RUNNER_TEMP/variables" ghidrassist.hardware.HardwareScopedVariableReceiptSelfTest
      - name: Assert exact pointer type/storage and refusal to auto rename
        run: java -cp "$RUNNER_TEMP/variables" ghidrassist.hardware.HardwareScopedVariableReviewSelfTest
