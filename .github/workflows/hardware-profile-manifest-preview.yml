name: Hardware profile manifest preview tests

on:
  push:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareProfileManifestPreview.java'
      - 'src/main/java/ghidrassist/ui/tabs/HardwareAnalysisTab.java'
      - 'src/test/java/ghidrassist/hardware/HardwareProfileManifestPreviewSelfTest.java'
      - '.github/workflows/hardware-profile-manifest-preview.yml'
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareProfileManifestPreview.java'
      - 'src/main/java/ghidrassist/ui/tabs/HardwareAnalysisTab.java'
      - 'src/test/java/ghidrassist/hardware/HardwareProfileManifestPreviewSelfTest.java'
      - '.github/workflows/hardware-profile-manifest-preview.yml'
  workflow_dispatch:

jobs:
  strict-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile strict external profile preview model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/profile-preview"
          javac --release 21 -d "$RUNNER_TEMP/profile-preview" \
            src/main/java/ghidrassist/hardware/HardwareProfileManifestPreview.java \
            src/test/java/ghidrassist/hardware/HardwareProfileManifestPreviewSelfTest.java
      - name: Test malformed, conflicting and ambiguous profile imports
        shell: bash
        run: |
          java -cp "$RUNNER_TEMP/profile-preview" \
            ghidrassist.hardware.HardwareProfileManifestPreviewSelfTest
