name: GA-05/08 real Ghidra pointer variables Review Apply Undo Redo
on:
  pull_request:
    paths:
      - '.github/workflows/ga05-ga08-real-ghidra-pointer-approval.yml'
      - 'src/main/java/ghidrassist/hardware/HardwareScopedVariableReview.java'
      - 'src/main/java/ghidrassist/hardware/HardwareScopedVariableService.java'
      - 'src/main/java/ghidrassist/hardware/HardwareScopedVariableReceipt.java'
      - 'src/test/java/ghidrassist/hardware/HardwareScopedVariableReceiptSelfTest.java'
      - 'src/main/java/ghidrassist/ui/tabs/HardwareAnalysisTab.java'
      - 'tests/ga11_headless/Ga11VectorHeadlessMain.java'
      - 'tests/ga11_headless/run.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pointer-approval-in-real-ghidra:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify synthetic runner syntax
        run: python3 -m py_compile tests/ga11_headless/run.py
      - name: Download and verify Ghidra 12.1.4 PUBLIC
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 \
            -o "$RUNNER_TEMP/ghidra.zip" \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_DIR="$(find "$RUNNER_TEMP/ghidra" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' -print -quit)"
          test -n "$GHIDRA_DIR"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
      - name: Build complete extension on Java25
        shell: bash
        run: |
          set -euo pipefail
          "$GHIDRA_INSTALL_DIR/support/gradle/gradlew" --no-daemon buildExtension
          shopt -s nullglob
          packages=(dist/ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip)
          test "${#packages[@]}" -eq 1
          unzip -tq "${packages[0]}"
          echo "EXTENSION=$PWD/${packages[0]}" >> "$GITHUB_ENV"
      - name: Real synthetic Function DB pointer arg/local Apply Undo Redo and stale guards
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sha256sum "$EXTENSION" | cut -d' ' -f1)"
          python3 tests/ga11_headless/run.py \
            --ghidra "$GHIDRA_INSTALL_DIR" \
            --java-home "$JAVA_HOME" \
            --extension-zip "$EXTENSION" \
            --extension-sha256 "$sha" \
            --output "$RUNNER_TEMP/ga05-ga08-pointers" \
            --strict-entry --ga18-mode scoped-variable
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"ga05-ga08-pointers"
          summary=json.loads((root/"summary.json").read_text())
          proof=json.loads((root/"result.json").read_text())
          assert summary["status"]=="PASSED_SYNTHETIC_REAL_GHIDRA_HEADLESS",summary
          assert summary["ghidra_version"]=="12.1.4",summary
          for key in (
              "scoped_v2_type_use_receipts",
              "scoped_real_pointer_param_local","scoped_atomic_rejection",
              "scoped_explicit_apply","scoped_native_undo_redo",
              "scoped_stale_revision_rejected"
          ):
              assert proof.get(key) is True,(key,proof)
          print("GA05 GA08 REAL GHIDRA FUNCTION POINTER APPLY UNDO REDO PASS")
          PY
      - name: Bounded diagnostics for failed synthetic-only Ghidra
        if: failure()
        shell: bash
        run: |
          root="$RUNNER_TEMP/ga05-ga08-pointers"
          for file in "$root/integration.log" "$root/compile.log" "$root/summary.json"; do
            if test -f "$file"; then
              echo "=== $(basename "$file") ==="
              tail -n 60 "$file"
            fi
          done
      - name: Publish isolated synthetic-only proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga05-ga08-pointer-review-${{ github.run_id }}
          path: ${{ runner.temp }}/ga05-ga08-pointers/
          if-no-files-found: ignore
          retention-days: 21
