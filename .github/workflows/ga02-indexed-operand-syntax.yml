name: GA-02 indexed CPU32 operand syntax source regression
on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareIndexedAddress.java'
      - 'src/test/java/ghidrassist/hardware/HardwareIndexedAddressSelfTest.java'
      - '.github/workflows/ga02-indexed-operand-syntax.yml'
  push:
    branches: [master]
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareIndexedAddress.java'
      - 'src/test/java/ghidrassist/hardware/HardwareIndexedAddressSelfTest.java'
      - '.github/workflows/ga02-indexed-operand-syntax.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-indexed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile exact CPU32 indexed operand parser with Java 21
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga02-indexed"
          javac --release 21 -d "$RUNNER_TEMP/ga02-indexed" \
            src/main/java/ghidrassist/hardware/HardwareIndexedAddress.java \
            src/test/java/ghidrassist/hardware/HardwareIndexedAddressSelfTest.java
      - name: Assert genuine Ghidra spellings and negative grammar controls
        shell: bash
        run: |
          set -euo pipefail
          java -cp "$RUNNER_TEMP/ga02-indexed" ghidrassist.hardware.HardwareIndexedAddressSelfTest
