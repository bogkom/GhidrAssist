name: Hardware sourced bitfield decoder tests

on:
  push:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareBitfieldSourceLedger.java'
      - 'src/test/java/ghidrassist/hardware/HardwareBitfieldSourceLedgerSelfTest.java'
      - 'src/main/java/ghidrassist/hardware/HardwareContextSelector.java'
      - 'src/test/java/ghidrassist/hardware/HardwareContextSelectorSelfTest.java'
      - 'src/main/java/ghidrassist/hardware/HardwareReportScope.java'
      - 'src/main/java/ghidrassist/hardware/HardwareInventoryService.java'
      - 'src/main/java/ghidrassist/hardware/HardwareBitfieldDecoder.java'
      - 'src/main/java/ghidrassist/hardware/ManualPdfPageClaim.java'
      - 'src/test/java/ghidrassist/hardware/ManualPdfPageClaimSelfTest.java'
      - 'src/main/java/ghidrassist/hardware/HardwareProfiles.java'
      - 'src/test/java/ghidrassist/hardware/HardwareBitfieldDecoderSelfTest.java'
      - '.github/workflows/hardware-bitfield-decoder-tests.yml'
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareBitfieldSourceLedger.java'
      - 'src/test/java/ghidrassist/hardware/HardwareBitfieldSourceLedgerSelfTest.java'
      - 'src/main/java/ghidrassist/hardware/HardwareContextSelector.java'
      - 'src/test/java/ghidrassist/hardware/HardwareContextSelectorSelfTest.java'
      - 'src/main/java/ghidrassist/hardware/HardwareReportScope.java'
      - 'src/main/java/ghidrassist/hardware/HardwareInventoryService.java'
      - 'src/main/java/ghidrassist/hardware/HardwareBitfieldDecoder.java'
      - 'src/main/java/ghidrassist/hardware/ManualPdfPageClaim.java'
      - 'src/test/java/ghidrassist/hardware/ManualPdfPageClaimSelfTest.java'
      - 'src/main/java/ghidrassist/hardware/HardwareProfiles.java'
      - 'src/test/java/ghidrassist/hardware/HardwareBitfieldDecoderSelfTest.java'
      - '.github/workflows/hardware-bitfield-decoder-tests.yml'
  workflow_dispatch:

jobs:
  bitfield-decode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile standalone decoder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bitfields"
          javac --release 21 -d "$RUNNER_TEMP/bitfields" \
            src/main/java/ghidrassist/hardware/HardwareProfiles.java \
            src/main/java/ghidrassist/hardware/HardwareBitfieldDecoder.java \
            src/main/java/ghidrassist/hardware/HardwareBitfieldSourceLedger.java \
            src/main/java/ghidrassist/hardware/HardwareContextSelector.java \
            src/test/java/ghidrassist/hardware/HardwareBitfieldSourceLedgerSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareContextSelectorSelfTest.java \
            src/main/java/ghidrassist/hardware/ManualPdfPageClaim.java \
            src/test/java/ghidrassist/hardware/HardwareBitfieldDecoderSelfTest.java \
            src/test/java/ghidrassist/hardware/ManualPdfPageClaimSelfTest.java
      - name: Verify known bits, source references and UNKNOWN cases
        run: java -cp "$RUNNER_TEMP/bitfields" ghidrassist.hardware.HardwareBitfieldDecoderSelfTest
      - name: Verify shared physical PDF page-claim validation
        run: java -cp "$RUNNER_TEMP/bitfields" ghidrassist.hardware.ManualPdfPageClaimSelfTest
      - name: Verify field-to-page ledger and PDF authentication caveat
        run: java -cp "$RUNNER_TEMP/bitfields" ghidrassist.hardware.HardwareBitfieldSourceLedgerSelfTest
      - name: Verify focused SIMCR/SYNCR RAG keeps bounded source citations
        run: java -cp "$RUNNER_TEMP/bitfields" ghidrassist.hardware.HardwareContextSelectorSelfTest
