name: GA-18 isolated review-copy Automation API regression

on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/automation/**'
      - 'src/main/java/ghidrassist/ui/**'
      - 'tools/ghidrassist-agent*'
      - 'tests/codebrowser_harness/**'
      - 'tests/automation/**'
      - '.github/workflows/ga18-review-copy.yml'
  workflow_dispatch:

jobs:
  review-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install isolated X11
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth openbox
      - name: Download SHA-256 pinned Ghidra 12.1.4 PUBLIC
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 10 --retry-all-errors --retry-delay 5 --retry-max-time 360 --connect-timeout 20 --max-time 240 \
            -o "$RUNNER_TEMP/ghidra.zip" \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_DIR=$(find "$RUNNER_TEMP/ghidra" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' -print -quit)
          test -n "$GHIDRA_DIR"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
      - name: Build exact GhidrAssist extension
        shell: bash
        run: |
          set -euo pipefail
          # Ghidra's isolated wrapper defaults to a 10s Gradle-download timeout.
          # Increase only this CI copy; preserve Ghidra/extension SHA checks.
          wrapper="$(find "$GHIDRA_INSTALL_DIR/support/gradle" \
            -type f -name 'gradle-wrapper.properties' -print -quit)"
          if test -n "$wrapper"; then
            if grep -q '^networkTimeout=' "$wrapper"; then
              sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$wrapper"
            else
              printf '\nnetworkTimeout=120000\n' >> "$wrapper"
            fi
          else
            echo "No editable Gradle wrapper properties; use the original verified Ghidra launcher."
          fi
          "$GHIDRA_INSTALL_DIR/support/gradle/gradlew" --no-daemon buildExtension
          EXTENSION="$(find dist -maxdepth 1 -name 'ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip' -type f -print -quit)"
          test -s "$EXTENSION"
          echo "EXTENSION=$EXTENSION" >> "$GITHUB_ENV"
      - name: Real Ghidra CodeBrowser isolated review-copy prepare/apply/undo
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/codebrowser_harness/run.py tools/ghidrassist-agent tools/ghidrassist-agent-start
          xvfb-run -a -s '-screen 0 1400x1050x24' \
            bash -c 'openbox --sm-disable >/dev/null 2>&1 & wm=$!; trap "kill $wm 2>/dev/null || true" EXIT; sleep 1; python3 tests/codebrowser_harness/run.py "$@"' review-copy \
              --ghidra "$GHIDRA_INSTALL_DIR" --java-home "$JAVA_HOME" \
              --extension-zip "$EXTENSION" \
              --output "$RUNNER_TEMP/review-copy-evidence" \
              --automation-probe --review-copy-probe --timeout 300
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"review-copy-evidence"
          result=json.loads((root/"result.json").read_text())
          apply=json.loads((root/"api-apply-undo.json").read_text())
          assert result["status"]=="PASSED_HARDWARE_AUTOMATION_V2",result
          assert apply["apply"]["changed"]==1,apply
          assert apply["undo"]["undone"] is True,apply
          assert apply["wrong_token_rejected"] is True,apply
          assert apply["second_undo_rejected"] is True,apply
          print("GA18 REVIEW COPY NATIVE PASS: single-item apply=1 undo=1 invalid_token_rejected=1")
          PY
      - name: Real CodeBrowser source-pair JSON-RPC paging + CLI snapshot + stale cursor regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/codebrowser_harness/run.py tools/ghidrassist-agent
          xvfb-run -a -s '-screen 0 1400x1050x24' \
            bash -c 'openbox --sm-disable >/dev/null 2>&1 & wm=$!; trap "kill $wm 2>/dev/null || true" EXIT; sleep 1; python3 tests/codebrowser_harness/run.py "$@"' source-pairs \
              --ghidra "$GHIDRA_INSTALL_DIR" --java-home "$JAVA_HOME" \
              --extension-zip "$EXTENSION" \
              --output "$RUNNER_TEMP/source-pairs-evidence" \
              --automation-probe --source-pairs-probe --timeout 300
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"source-pairs-evidence"
          evidence=json.loads((root/"source-pairs-real-rpc.json").read_text())
          assert evidence["schema"]==1,evidence
          assert evidence["real_codebrowser"] and evidence["real_bearer_jsonrpc"],evidence
          assert evidence["native_program"]=="synthetic-reset-indirect-vbr.bin",evidence
          assert evidence["total_pairs"]==2 and len(evidence["all_observed_rows"])==2,evidence
          assert evidence["all_observed_rows"][0]["indirectPc"]==0x138,evidence
          assert evidence["all_observed_rows"][1]["indirectPc"]==0x206,evidence
          for key in ("generic_cpu32_denied","malformed_cursors_denied",
                      "switched_program_denied","source_generation_changed",
                      "no_production_write"):
              assert evidence[key] is True,(key,evidence)
          assert evidence["omitted_indirect"]==1,evidence
          assert evidence["local_checkpoint_complete"] is False,evidence
          assert len(evidence["local_checkpoint_sha256"])==64,evidence
          print("GA12 REAL CODEBROWSER SOURCE PAIRS HTTP + CLI PASS: pairs=2 stale=DENIED")
          PY
      - name: Verify local source checkpoint after actual CodeBrowser exit; tampering denied
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/source-pairs-evidence"
          python3 tools/ghidrassist-agent --session "$RUNNER_TEMP/nonexistent-session.json" \
            source-pairs-verify --input "$root/source-pairs-v1-checkpoint.json" \
            > "$RUNNER_TEMP/source-pairs-offline-verified.json"
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"source-pairs-evidence"
          verified=json.loads((Path(os.environ["RUNNER_TEMP"])/
              "source-pairs-offline-verified.json").read_text())
          assert verified["verified"] and verified["total_pairs"]==2,verified
          assert not verified["bounded_source_complete"] and not verified["resume_authorized"],verified
          original=root/"source-pairs-v1-checkpoint.json"
          altered=root/"tampered-offline.json"
          envelope=json.loads(original.read_text())
          envelope["payload"]["rows"][0]["indirectPc"]=0x999
          altered.write_text(json.dumps(envelope))
          result=subprocess.run(["python3","tools/ghidrassist-agent",
              "--session",str(root/"missing-token.json"),
              "source-pairs-verify","--input",str(altered)],
              capture_output=True,text=True)
          assert result.returncode!=0,result.stdout
          assert "SHA-256 mismatch" in result.stderr,result.stderr
          print("GA12 OFFLINE SOURCE CHECKPOINT AFTER CODEBROWSER EXIT PASS")
          PY
      - name: Reject mismatched source SHA-256 before any copy write
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1400x1050x24' \
            bash -c 'openbox --sm-disable >/dev/null 2>&1 & wm=$!; trap "kill $wm 2>/dev/null || true" EXIT; sleep 1; python3 tests/codebrowser_harness/run.py "$@"' review-copy-negative \
              --ghidra "$GHIDRA_INSTALL_DIR" --java-home "$JAVA_HOME" \
              --extension-zip "$EXTENSION" \
              --output "$RUNNER_TEMP/review-copy-negative" \
              --automation-probe --review-copy-probe --review-copy-bad-sha --timeout 300
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"review-copy-negative"
          result=json.loads((root/"result.json").read_text())
          assert result["status"]=="EXPECTED_REVIEW_COPY_SHA_DENIAL",result
          assert result["source_identity_denied"] is True,result
          assert result["database_edits"] is False,result
          assert not (root/"api-apply-undo.json").exists()
          print("GA18 REVIEW COPY SHA MISMATCH DENIED: no edits")
          PY
      - name: Publish isolated regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga18-review-copy-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/review-copy-evidence/
            ${{ runner.temp }}/review-copy-negative/
            ${{ runner.temp }}/source-pairs-evidence/
          if-no-files-found: ignore
          retention-days: 14
