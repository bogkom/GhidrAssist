name: GA-06/10/16 RAG PDF index digest and source integrity
on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/core/RAGSourceProvenance.java'
      - 'src/main/java/ghidrassist/core/RAGIndexedPdfPageEvidence.java'
      - 'src/main/java/ghidrassist/core/SearchResult.java'
      - 'src/main/java/ghidrassist/core/RAGEngine.java'
      - 'src/main/java/ghidrassist/core/RAGSourceOpener.java'
      - 'src/main/java/ghidrassist/tools/native_/RAGSearchToolProvider.java'
      - 'src/main/java/ghidrassist/hardware/HardwareBitfieldSourceLedger.java'
      - 'src/test/java/ghidrassist/core/RAGSourceProvenanceSelfTest.java'
      - 'src/test/java/ghidrassist/core/RAGIndexedPdfPageEvidenceSelfTest.java'
      - '.github/workflows/ga061016-rag-pdf-source-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-java21:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify same-page Lucene metadata and indexed-to-file PDF digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga061016-rag"
          javac --release 21 -d "$RUNNER_TEMP/ga061016-rag" \
            src/main/java/ghidrassist/hardware/ManualPdfPageClaim.java \
            src/main/java/ghidrassist/hardware/HardwareProfiles.java \
            src/main/java/ghidrassist/hardware/HardwareBitfieldSourceLedger.java \
            src/main/java/ghidrassist/core/SearchResult.java \
            src/main/java/ghidrassist/core/RAGSourceProvenance.java \
            src/main/java/ghidrassist/core/RAGIndexedPdfPageEvidence.java \
            src/main/java/ghidrassist/core/RAGSourceOpener.java \
            src/test/java/ghidrassist/core/RAGIndexedPdfPageEvidenceSelfTest.java \
            src/test/java/ghidrassist/core/RAGSourceProvenanceSelfTest.java
          java -cp "$RUNNER_TEMP/ga061016-rag" \
            ghidrassist.core.RAGIndexedPdfPageEvidenceSelfTest
          java -cp "$RUNNER_TEMP/ga061016-rag" \
            ghidrassist.core.RAGSourceProvenanceSelfTest
          echo 'SOURCE DIGEST/CURRENT FILE BOUNDARY PASS; not model execution or PDF edition proof'
