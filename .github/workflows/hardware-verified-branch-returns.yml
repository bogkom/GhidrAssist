name: GA-02/03 bounded branch-convergent return registers
on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareDataflow.java'
      - 'src/main/java/ghidrassist/hardware/HardwareVerifiedBranchReturn.java'
      - 'src/main/java/ghidrassist/hardware/GhidraHardwareFlowService.java'
      - 'src/test/java/ghidrassist/hardware/HardwareVerifiedBranchReturnSelfTest.java'
      - '.github/workflows/hardware-verified-branch-returns.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bounded branch join and negative cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga0203-branches"
          javac --release 21 -d "$RUNNER_TEMP/ga0203-branches" \
            src/main/java/ghidrassist/hardware/HardwareDataflow.java \
            src/main/java/ghidrassist/hardware/HardwareVerifiedBranchReturn.java \
            src/test/java/ghidrassist/hardware/HardwareVerifiedBranchReturnSelfTest.java
          java -cp "$RUNNER_TEMP/ga0203-branches" \
            ghidrassist.hardware.HardwareVerifiedBranchReturnSelfTest
