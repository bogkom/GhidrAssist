name: GA-12/15 real Ghidra Program Agentic read-only evidence bridge
on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/agent/react/AgenticEvidenceRegistry.java'
      - 'src/main/java/ghidrassist/agent/react/FindingsCache.java'
      - 'src/main/java/ghidrassist/agent/react/ReActOrchestrator.java'
      - 'src/main/java/ghidrassist/automation/AutomationServer.java'
      - 'tests/ga11_headless/Ga11VectorHeadlessMain.java'
      - 'tests/ga11_headless/run.py'
      - '.github/workflows/ga12-ga15-agentic-real-ghidra.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-real-program:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify Python runner syntax
        run: python3 -m py_compile tests/ga11_headless/run.py
      - name: Verify official Ghidra 12.1.4 PUBLIC
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 -o "$RUNNER_TEMP/ghidra.zip" \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_DIR="$(find "$RUNNER_TEMP/ghidra" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' -print -quit)"
          test -n "$GHIDRA_DIR"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
      - name: Build real GhidrAssist extension on Java25
        shell: bash
        run: |
          set -euo pipefail
          "$GHIDRA_INSTALL_DIR/support/gradle/gradlew" --no-daemon buildExtension
          shopt -s nullglob
          packages=(dist/ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip)
          test "${#packages[@]}" -eq 1
          unzip -tq "${packages[0]}"
          echo "EXTENSION=$PWD/${packages[0]}" >> "$GITHUB_ENV"
      - name: Real Program identity and source completeness without model calls
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sha256sum "$EXTENSION" | cut -d' ' -f1)"
          python3 tests/ga11_headless/run.py \
            --ghidra "$GHIDRA_INSTALL_DIR" \
            --java-home "$JAVA_HOME" \
            --extension-zip "$EXTENSION" \
            --extension-sha256 "$sha" \
            --output "$RUNNER_TEMP/ga12-ga15-agentic" \
            --strict-entry --ga18-mode agentic-evidence
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"ga12-ga15-agentic"
          summary=json.loads((root/"summary.json").read_text())
          proof=json.loads((root/"result.json").read_text())
          assert summary["status"]=="PASSED_SYNTHETIC_REAL_GHIDRA_HEADLESS",summary
          assert summary["ghidra_version"]=="12.1.4",summary
          for key in (
              "agentic_real_program_bounded_pages",
              "agentic_real_program_revision_guard",
              "agentic_source_incomplete_remains_explicit",
              "agentic_read_only_revision_unchanged"):
              assert proof.get(key) is True,(key,proof)
          print("GA12/15 REAL GHIDRA PROGRAM AGENTIC EVIDENCE PASS")
          PY
      - name: Bounded failure diagnostics
        if: failure()
        shell: bash
        run: |
          root="$RUNNER_TEMP/ga12-ga15-agentic"
          for file in "$root/integration.log" "$root/compile.log" "$root/summary.json"; do
            if test -f "$file"; then
              echo "=== $(basename "$file") ==="
              tail -n 65 "$file"
            fi
          done
      - name: Publish synthetic-only proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga12-ga15-agentic-real-program-${{ github.run_id }}
          path: ${{ runner.temp }}/ga12-ga15-agentic/
          if-no-files-found: ignore
          retention-days: 21
