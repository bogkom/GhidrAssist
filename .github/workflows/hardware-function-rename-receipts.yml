name: GA-13 transactional function rename receipt integrity

on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareFunctionRenameReceipt.java'
      - 'src/main/java/ghidrassist/hardware/HardwareFunctionRenameService.java'
      - 'src/test/java/ghidrassist/hardware/HardwareFunctionRenameReceiptSelfTest.java'
      - 'tests/ga11_headless/Ga11VectorHeadlessMain.java'
      - '.github/workflows/hardware-function-rename-receipts.yml'
  push:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareFunctionRenameReceipt.java'
      - 'src/main/java/ghidrassist/hardware/HardwareFunctionRenameService.java'
      - 'src/test/java/ghidrassist/hardware/HardwareFunctionRenameReceiptSelfTest.java'
      - 'tests/ga11_headless/Ga11VectorHeadlessMain.java'
      - '.github/workflows/hardware-function-rename-receipts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-source-java21:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile bounded source-only receipt codec
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga13-rename-receipts"
          javac --release 21 -d "$RUNNER_TEMP/ga13-rename-receipts" \
            src/main/java/ghidrassist/hardware/HardwareFunctionRenameReceipt.java \
            src/test/java/ghidrassist/hardware/HardwareFunctionRenameReceiptSelfTest.java
      - name: Assert schema version, revision, identity and corruption rejections
        shell: bash
        run: |
          set -euo pipefail
          java -cp "$RUNNER_TEMP/ga13-rename-receipts" \
            ghidrassist.hardware.HardwareFunctionRenameReceiptSelfTest
