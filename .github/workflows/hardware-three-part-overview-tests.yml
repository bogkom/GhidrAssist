name: Hardware Analyze three-part overview tests

on:
  push:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareReportOverview.java'
      - 'src/main/java/ghidrassist/hardware/HardwareReportScope.java'
      - 'src/main/java/ghidrassist/hardware/HardwareInventoryService.java'
      - 'src/main/java/ghidrassist/ui/tabs/HardwareAnalysisTab.java'
      - 'src/test/java/ghidrassist/hardware/HardwareReportOverviewSelfTest.java'
      - '.github/workflows/hardware-three-part-overview-tests.yml'
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareReportOverview.java'
      - 'src/main/java/ghidrassist/hardware/HardwareReportScope.java'
      - 'src/main/java/ghidrassist/hardware/HardwareInventoryService.java'
      - 'src/main/java/ghidrassist/ui/tabs/HardwareAnalysisTab.java'
      - 'src/test/java/ghidrassist/hardware/HardwareReportOverviewSelfTest.java'
      - '.github/workflows/hardware-three-part-overview-tests.yml'
  workflow_dispatch:

jobs:
  overview-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile deterministic three-part summary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/overview"
          javac --release 21 -d "$RUNNER_TEMP/overview" \
            src/main/java/ghidrassist/hardware/HardwareReportScope.java \
            src/main/java/ghidrassist/hardware/HardwareStartupConfig.java \
            src/main/java/ghidrassist/hardware/HardwareStartupEvidenceMerge.java \
            src/main/java/ghidrassist/hardware/HardwareReportOverview.java \
            src/test/java/ghidrassist/hardware/HardwareReportOverviewSelfTest.java
      - name: Assert static-only counts and generic CPU32 mode
        run: java -cp "$RUNNER_TEMP/overview" ghidrassist.hardware.HardwareReportOverviewSelfTest
