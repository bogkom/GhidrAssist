name: GA-12 real Ghidra V2 JSR MOVEC source checkpoint across fresh JVMs
on:
  pull_request:
    paths:
      - 'tests/ga12_durable/**'
      - 'src/main/java/ghidrassist/agent/react/AgenticReviewProgramBinding.java'
      - 'src/main/java/ghidrassist/agent/react/AgenticReviewDraft.java'
      - 'tools/ghidra_scripts/GA12BootstrapDurableSourceV2.java'
      - 'tools/generate-synthetic-reset-indirect-vbr.py'
      - 'src/main/java/ghidrassist/hardware/HardwareDurableCfgReport.java'
      - 'src/main/java/ghidrassist/hardware/HardwareFlowStageCache.java'
      - 'src/main/java/ghidrassist/hardware/HardwareGhidraInputFingerprint.java'
      - '.github/workflows/ga12-v2-native-jvm-source-restore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-source-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Fetch exact independently hashed Ghidra 12.1.4 PUBLIC
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 \
            -o "$RUNNER_TEMP/ghidra.zip" \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_DIR="$(find "$RUNNER_TEMP/ghidra" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' -print -quit)"
          test -n "$GHIDRA_DIR"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
      - name: Build complete installable GhidrAssist extension for exact Ghidra
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/ghidra-gradle-ci-network.sh "$GHIDRA_INSTALL_DIR"
          "$GHIDRA_INSTALL_DIR/support/gradle/gradlew" \
            --no-daemon --stacktrace buildExtension
      - name: Verify 3 CFG and 10 JSR MOVEC V2/V1 Review-binding JVM phases
        shell: bash
        run: |
          set -euo pipefail
          package="$(find dist -maxdepth 1 -type f -name 'ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip' -print -quit)"
          test -n "$package"
          sha="$(sha256sum "$package" | awk '{print $1}')"
          python3 tests/ga12_durable/run.py \
            --ghidra "$GHIDRA_INSTALL_DIR" \
            --java-home "$JAVA_HOME" \
            --extension-zip "$package" \
            --extension-sha256 "$sha" \
            --output "$RUNNER_TEMP/ga12-v2-real"
          python3 - "$RUNNER_TEMP/ga12-v2-real/summary.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          expected={
              "status":"PASSED_SYNTHETIC_REAL_GHIDRA_HEADLESS",
              "restart_processes":3,
              "v2_source_processes":10,
              "v2_resealed_forged_may_mm_pages_refused":True,
              "v2_forged_claim_cleared_then_live_source_replayed":True,
              "v2_cfg_only_restored_source_inventory_denied":True,
              "saved_review_binding_cross_jvm":True,
              "saved_review_changed_bytes_denied":True,
              "saved_review_renamed_function_denied":True,
              "saved_review_wrong_mc68332_profile_denied":True,
              "v2_source_cold_computed":True,
              "v2_corrupt_semantic_checksum_refused":True,
              "v2_mismatched_reset_provenance_refused":True,
              "v2_incomplete_cfg_checkpoint_refused":True,
              "v2_source_reopened_reused":True,
              "v1_legacy_cfg_only_reused":True,
              "v1_source_inventory_refused":True,
              "edited_v2_input_recomputed":True,
              "generic_cpu32_profile_refused":True,
              "byte_verified_jsr_movec_pairs":2,
              "unknown_indirect_sources":1,
              "supervisor_pass":False,
          }
          for k,v in expected.items():
              assert p.get(k)==v, (k,p.get(k),v)
          print("GA12 REAL GHIDRA V2 SOURCE RESTART PASS: phases=13 native_pairs=2 omissions=1")
          PY
      - name: Bounded diagnostic tail for synthetic-only failures
        if: failure()
        shell: bash
        run: |
          for f in "$RUNNER_TEMP"/ga12-v2-real/{source-import-bootstrap,source-compile,integration-source-write,integration-source-read,integration-source-corrupt,integration-source-mismatch,integration-source-incomplete,integration-source-v1,integration-source-edit,integration-source-name,integration-source-profile,integration-source-forged}.log; do
            if test -f "$f"; then
              echo "=== $(basename "$f") ==="
              tail -n 65 "$f"
            fi
          done
      - name: Upload only deterministic synthetic summary (never Program or firmware)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GA12-real-Ghidra-V2-source-restart
          path: ${{ runner.temp }}/ga12-v2-real/summary.json
          if-no-files-found: ignore
