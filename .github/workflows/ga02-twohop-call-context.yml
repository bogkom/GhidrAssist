name: GA-02/03 bounded two-hop CALL register-context safety
on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareDataflow.java'
      - 'src/main/java/ghidrassist/hardware/HardwareCallsiteRegisterFlow.java'
      - 'src/main/java/ghidrassist/hardware/HardwareTwoHopRegisterFlow.java'
      - 'src/main/java/ghidrassist/hardware/HardwareTwoHopConsensus.java'
      - 'src/main/java/ghidrassist/hardware/GhidraHardwareFlowService.java'
      - 'src/test/java/ghidrassist/hardware/HardwareTwoHopRegisterFlowSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareTwoHopConsensusSelfTest.java'
      - '.github/workflows/ga02-twohop-call-context.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Two-hop A/D contexts, unknown alias, cycle, A7 stack and cache safety
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga02-two-hop"
          javac --release 21 -d "$RUNNER_TEMP/ga02-two-hop" \
            src/main/java/ghidrassist/hardware/HardwareDataflow.java \
            src/main/java/ghidrassist/hardware/HardwareCallsiteRegisterFlow.java \
            src/main/java/ghidrassist/hardware/HardwareTwoHopRegisterFlow.java \
            src/main/java/ghidrassist/hardware/HardwareTwoHopConsensus.java \
            src/main/java/ghidrassist/hardware/HardwareAnalysisRevision.java \
            src/test/java/ghidrassist/hardware/HardwareTwoHopRegisterFlowSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareTwoHopConsensusSelfTest.java
          java -cp "$RUNNER_TEMP/ga02-two-hop" \
            ghidrassist.hardware.HardwareTwoHopRegisterFlowSelfTest
          java -cp "$RUNNER_TEMP/ga02-two-hop" \
            ghidrassist.hardware.HardwareTwoHopConsensusSelfTest
