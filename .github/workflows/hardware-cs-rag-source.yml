name: GA-04/07 bounded CS table RAG source selection
on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareContextSelector.java'
      - 'src/test/java/ghidrassist/hardware/HardwareContextSelectorSelfTest.java'
      - '.github/workflows/hardware-cs-rag-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test bounded source-only CS table, SIMCR/SYNCR RAG and omissions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cs-rag"
          javac --release 21 -d "$RUNNER_TEMP/cs-rag" \
            src/main/java/ghidrassist/hardware/HardwareProfiles.java \
            src/main/java/ghidrassist/hardware/ManualPdfPageClaim.java \
            src/main/java/ghidrassist/hardware/HardwareBitfieldSourceLedger.java \
            src/main/java/ghidrassist/hardware/ChipSelectModel.java \
            src/main/java/ghidrassist/hardware/ChipSelectTable.java \
            src/main/java/ghidrassist/hardware/HardwareBitMath.java \
            src/main/java/ghidrassist/hardware/HardwareContextSelector.java \
            src/test/java/ghidrassist/hardware/HardwareContextSelectorSelfTest.java
          java -ea -cp "$RUNNER_TEMP/cs-rag" \
            ghidrassist.hardware.HardwareContextSelectorSelfTest
