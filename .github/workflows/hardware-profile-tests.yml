      - 'src/main/java/ghidrassist/hardware/HardwareDataflow.java'
      - 'src/main/java/ghidrassist/hardware/HardwareIndexedAddress.java'
      - 'src/main/java/ghidrassist/hardware/HardwareApplyPlan.java'
      - 'src/main/java/ghidrassist/hardware/HardwareRegionLayout.java'
      - 'src/test/java/ghidrassist/hardware/HardwareProfilesSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/ChipSelectModelSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/FirmwarePatternScannerSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/ManualRegisterHintsSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/ManualModuleTableSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/ManualDocumentScopeSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareNamingReviewSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareFunctionNamingReviewSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareFunctionRenamePolicySelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareContextSelectorSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareDataflowSelfTest.java'
