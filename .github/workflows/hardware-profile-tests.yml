      - 'src/main/java/ghidrassist/hardware/HardwareIndexedAddress.java'
      - 'src/main/java/ghidrassist/hardware/HardwareApplyPlan.java'
      - 'src/main/java/ghidrassist/hardware/HardwareRegionLayout.java'
