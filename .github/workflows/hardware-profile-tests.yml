      - 'src/test/java/ghidrassist/hardware/HardwareApplyPlanSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareRegionLayoutSelfTest.java'
      - '.github/workflows/hardware-profile-tests.yml'
