      - feature/hardware-analysis-seven-stages
      - feature/hardware-controlflow-rag-integration
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareProfiles.java'
      - 'src/main/java/ghidrassist/hardware/ChipSelectModel.java'
