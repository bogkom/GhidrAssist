      - 'src/test/java/ghidrassist/hardware/HardwareApplyPlanSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareRegionLayoutSelfTest.java'
      - '.github/workflows/hardware-profile-tests.yml'

jobs:
  profile-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test the standalone register catalog
        run: |
          mkdir -p "$RUNNER_TEMP/hardware-tests"
          javac --release 21 -d "$RUNNER_TEMP/hardware-tests" \
            src/main/java/ghidrassist/hardware/HardwareProfiles.java \
            src/main/java/ghidrassist/hardware/ChipSelectModel.java \
            src/main/java/ghidrassist/hardware/FirmwarePatternScanner.java \
            src/main/java/ghidrassist/hardware/ManualRegisterHints.java \
            src/main/java/ghidrassist/hardware/ManualModuleTable.java \
            src/main/java/ghidrassist/hardware/ManualDocumentScope.java \
            src/main/java/ghidrassist/hardware/HardwareNamingReview.java \
            src/main/java/ghidrassist/hardware/HardwareFunctionNamingReview.java \
            src/main/java/ghidrassist/hardware/HardwareFunctionRenamePolicy.java \
            src/main/java/ghidrassist/hardware/HardwareDataflow.java \
            src/main/java/ghidrassist/hardware/HardwareIndexedAddress.java \
            src/main/java/ghidrassist/hardware/HardwareContextSelector.java \
            src/main/java/ghidrassist/hardware/HardwareApplyPlan.java \
            src/main/java/ghidrassist/hardware/HardwareRegionLayout.java \
            src/test/java/ghidrassist/hardware/HardwareProfilesSelfTest.java \
            src/test/java/ghidrassist/hardware/ChipSelectModelSelfTest.java \
            src/test/java/ghidrassist/hardware/FirmwarePatternScannerSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareNamingReviewSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareFunctionNamingReviewSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareFunctionRenamePolicySelfTest.java \
            src/test/java/ghidrassist/hardware/ManualRegisterHintsSelfTest.java \
            src/test/java/ghidrassist/hardware/ManualModuleTableSelfTest.java \
            src/test/java/ghidrassist/hardware/ManualDocumentScopeSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareDataflowSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareIndexedAddressSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareContextSelectorSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareApplyPlanSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareRegionLayoutSelfTest.java
          java -cp "$RUNNER_TEMP/hardware-tests" \
            ghidrassist.hardware.HardwareProfilesSelfTest
          java -cp "$RUNNER_TEMP/hardware-tests" \
            ghidrassist.hardware.ChipSelectModelSelfTest
          java -cp "$RUNNER_TEMP/hardware-tests" \
            ghidrassist.hardware.FirmwarePatternScannerSelfTest
          java -cp "$RUNNER_TEMP/hardware-tests" \
            ghidrassist.hardware.ManualRegisterHintsSelfTest
          java -cp "$RUNNER_TEMP/hardware-tests" \
            ghidrassist.hardware.ManualModuleTableSelfTest
          java -cp "$RUNNER_TEMP/hardware-tests" \
            ghidrassist.hardware.ManualDocumentScopeSelfTest
          java -cp "$RUNNER_TEMP/hardware-tests" \
            ghidrassist.hardware.HardwareNamingReviewSelfTest
          java -cp "$RUNNER_TEMP/hardware-tests" \
            ghidrassist.hardware.HardwareFunctionNamingReviewSelfTest
          java -cp "$RUNNER_TEMP/hardware-tests" \
            ghidrassist.hardware.HardwareFunctionRenamePolicySelfTest
          java -cp "$RUNNER_TEMP/hardware-tests" \
            ghidrassist.hardware.HardwareDataflowSelfTest
          java -cp "$RUNNER_TEMP/hardware-tests" \
            ghidrassist.hardware.HardwareIndexedAddressSelfTest
          java -cp "$RUNNER_TEMP/hardware-tests" \
            ghidrassist.hardware.HardwareContextSelectorSelfTest
          java -cp "$RUNNER_TEMP/hardware-tests" \
            ghidrassist.hardware.HardwareApplyPlanSelfTest
          java -cp "$RUNNER_TEMP/hardware-tests" \
            ghidrassist.hardware.HardwareRegionLayoutSelfTest
