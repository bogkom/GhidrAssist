name: Hardware profile sanity tests

on:
  push:
    branches:
      - feature/hardware-analysis
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareProfiles.java'
      - 'src/test/java/ghidrassist/hardware/HardwareProfilesSelfTest.java'
      - '.github/workflows/hardware-profile-tests.yml'
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareProfiles.java'
      - 'src/test/java/ghidrassist/hardware/HardwareProfilesSelfTest.java'
      - '.github/workflows/hardware-profile-tests.yml'

jobs:
  profile-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test the standalone register catalog
        run: |
          mkdir -p "$RUNNER_TEMP/hardware-tests"
          javac --release 21 -d "$RUNNER_TEMP/hardware-tests" \
            src/main/java/ghidrassist/hardware/HardwareProfiles.java \
            src/test/java/ghidrassist/hardware/HardwareProfilesSelfTest.java
          java -cp "$RUNNER_TEMP/hardware-tests" \
            ghidrassist.hardware.HardwareProfilesSelfTest
