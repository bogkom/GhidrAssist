name: GA-12 durable completed-stage checkpoint safety
on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareDurableStageStore.java'
      - 'src/main/java/ghidrassist/hardware/HardwareDurableCfgReport.java'
      - 'src/test/java/ghidrassist/hardware/HardwareDurableStageStoreSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareDurableCfgReportSelfTest.java'
      - '.github/workflows/hardware-durable-stage-checkpoint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify atomic disk roundtrip, validation and no symlinks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga12"
          javac --release 21 -d "$RUNNER_TEMP/ga12" \
            src/main/java/ghidrassist/hardware/HardwareDurableStageStore.java \
            src/main/java/ghidrassist/hardware/HardwareDurableCfgReport.java \
            src/test/java/ghidrassist/hardware/HardwareDurableStageStoreSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareDurableCfgReportSelfTest.java
          java -cp "$RUNNER_TEMP/ga12" \
            ghidrassist.hardware.HardwareDurableStageStoreSelfTest
          java -cp "$RUNNER_TEMP/ga12" \
            ghidrassist.hardware.HardwareDurableCfgReportSelfTest
