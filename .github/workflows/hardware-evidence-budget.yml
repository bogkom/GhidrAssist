name: Hardware bounded evidence budget regressions
on:
  push:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareEvidenceBudget.java'
      - 'src/main/java/ghidrassist/hardware/GhidraHardwareFlowService.java'
      - 'src/main/java/ghidrassist/hardware/HardwareCsbarUnifiedReview.java'
      - 'src/test/java/ghidrassist/hardware/HardwareEvidenceBudgetSelfTest.java'
      - '.github/workflows/hardware-evidence-budget.yml'
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareEvidenceBudget.java'
      - 'src/main/java/ghidrassist/hardware/GhidraHardwareFlowService.java'
      - 'src/main/java/ghidrassist/hardware/HardwareCsbarUnifiedReview.java'
      - 'src/test/java/ghidrassist/hardware/HardwareEvidenceBudgetSelfTest.java'
      - '.github/workflows/hardware-evidence-budget.yml'
  workflow_dispatch:
jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile bounded source observations
        run: |
          mkdir -p "$RUNNER_TEMP/evidence-budget"
          javac --release 21 -d "$RUNNER_TEMP/evidence-budget" \
            src/main/java/ghidrassist/hardware/HardwareEvidenceBudget.java \
            src/test/java/ghidrassist/hardware/HardwareEvidenceBudgetSelfTest.java
      - name: Check truncation, fail-closed review and immutability
        run: java -cp "$RUNNER_TEMP/evidence-budget" ghidrassist.hardware.HardwareEvidenceBudgetSelfTest
