name: Hardware local PDF identity checksum tests

on:
  push:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareProfilePdfHashCheck.java'
      - 'src/main/java/ghidrassist/ui/tabs/HardwareAnalysisTab.java'
      - 'src/test/java/ghidrassist/hardware/HardwareProfilePdfHashCheckSelfTest.java'
      - '.github/workflows/hardware-profile-pdf-hash-tests.yml'
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareProfilePdfHashCheck.java'
      - 'src/main/java/ghidrassist/ui/tabs/HardwareAnalysisTab.java'
      - 'src/test/java/ghidrassist/hardware/HardwareProfilePdfHashCheckSelfTest.java'
      - '.github/workflows/hardware-profile-pdf-hash-tests.yml'
  workflow_dispatch:

jobs:
  sha256:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile local PDF verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pdf-hash"
          javac --release 21 -d "$RUNNER_TEMP/pdf-hash" \
            src/main/java/ghidrassist/hardware/HardwareProfilePdfHashCheck.java \
            src/test/java/ghidrassist/hardware/HardwareProfilePdfHashCheckSelfTest.java
      - name: Verify hash/mismatch/invalid-PDF/size-limit cases
        run: java -cp "$RUNNER_TEMP/pdf-hash" ghidrassist.hardware.HardwareProfilePdfHashCheckSelfTest
