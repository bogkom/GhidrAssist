name: GA-01/02/03/11 static vector/RESET correlation regressions

on:
  push:
    branches: [master]
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareVectorResetCorrelation.java'
      - 'src/main/java/ghidrassist/hardware/HardwareResetHandlerWitness.java'
      - 'src/main/java/ghidrassist/hardware/HardwareResetEffectSites.java'
      - 'src/main/java/ghidrassist/hardware/HardwareDecodedEffectSites.java'
      - 'src/main/java/ghidrassist/hardware/HardwareGhidraEffectSiteDecoder.java'
      - 'src/main/java/ghidrassist/hardware/HardwareMovecDirectionEvidence.java'
      - 'src/main/java/ghidrassist/hardware/HardwareResetFlow.java'
      - 'src/main/java/ghidrassist/hardware/HardwareCallEffects.java'
      - 'src/test/java/ghidrassist/hardware/HardwareVectorResetCorrelationSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareResetHandlerWitnessSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareResetEffectSitesSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareDecodedEffectSitesSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareMovecDirectionEvidenceSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareCallEffectsSelfTest.java'
      - 'ghidra_scripts/GA18PrepareDecodedEffectSites.java'
      - 'ghidra_scripts/GA18VerifyDecodedEffectSites.java'
      - 'docs/ga01-decoded-sites-cpu32-fixture.md'
      - 'scripts/create-ga01-cpu32-decoder-fixture.py'
      - 'scripts/run-ga01-cpu32-headless.py'
      - 'tests/test_ga01_cpu32_headless_runner.py'
      - '.github/workflows/hardware-vector-reset-correlation.yml'
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareVectorResetCorrelation.java'
      - 'src/main/java/ghidrassist/hardware/HardwareResetHandlerWitness.java'
      - 'src/main/java/ghidrassist/hardware/HardwareResetEffectSites.java'
      - 'src/main/java/ghidrassist/hardware/HardwareDecodedEffectSites.java'
      - 'src/main/java/ghidrassist/hardware/HardwareGhidraEffectSiteDecoder.java'
      - 'src/main/java/ghidrassist/hardware/HardwareMovecDirectionEvidence.java'
      - 'src/main/java/ghidrassist/hardware/HardwareResetFlow.java'
      - 'src/main/java/ghidrassist/hardware/HardwareCallEffects.java'
      - 'src/test/java/ghidrassist/hardware/HardwareVectorResetCorrelationSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareResetHandlerWitnessSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareResetEffectSitesSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareDecodedEffectSitesSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareMovecDirectionEvidenceSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareCallEffectsSelfTest.java'
      - 'ghidra_scripts/GA18PrepareDecodedEffectSites.java'
      - 'ghidra_scripts/GA18VerifyDecodedEffectSites.java'
      - 'docs/ga01-decoded-sites-cpu32-fixture.md'
      - 'scripts/create-ga01-cpu32-decoder-fixture.py'
      - 'scripts/run-ga01-cpu32-headless.py'
      - 'tests/test_ga01_cpu32_headless_runner.py'
      - '.github/workflows/hardware-vector-reset-correlation.yml'

jobs:
  static-correlation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify reproducible CPU32 synthetic fixture and no-overwrite guard
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/ga01-cpu32-decoder.bin"
          python3 scripts/create-ga01-cpu32-decoder-fixture.py "$fixture"
          python3 - "$fixture" <<'PY'
          import hashlib, pathlib, sys
          from importlib.machinery import SourceFileLoader
          generator = SourceFileLoader("ga01_fixture", "scripts/create-ga01-cpu32-decoder-fixture.py").load_module()
          actual = pathlib.Path(sys.argv[1]).read_bytes()
          generator.verify(actual)
          assert hashlib.sha256(actual).hexdigest() == hashlib.sha256(generator.PAYLOAD).hexdigest()
          print("GA18_CPU32_FIXTURE_BYTES_PASS")
          PY
          if python3 scripts/create-ga01-cpu32-decoder-fixture.py "$fixture"; then
            echo "FAIL: fixture generator overwrote existing file" >&2
            exit 1
          fi
          echo "GA18_CPU32_FIXTURE_NO_OVERWRITE_PASS"
      - name: Verify isolated CPU32 headless runner contract (mock only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/run-ga01-cpu32-headless.py
          python3 -m unittest discover -s tests -p 'test_ga01_cpu32_headless_runner.py' -v
      - name: Compile and test pure-Java bounded graph/vector evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vector-reset-tests"
          javac --release 21 -d "$RUNNER_TEMP/vector-reset-tests" \
            src/main/java/ghidrassist/hardware/HardwareCallEffects.java \
            src/main/java/ghidrassist/hardware/HardwareResetFlow.java \
            src/main/java/ghidrassist/hardware/HardwareVectorResetCorrelation.java \
            src/main/java/ghidrassist/hardware/HardwareResetHandlerWitness.java \
            src/main/java/ghidrassist/hardware/HardwareResetEffectSites.java \
            src/main/java/ghidrassist/hardware/HardwareDecodedEffectSites.java \
            src/main/java/ghidrassist/hardware/HardwareMovecDirectionEvidence.java \
            src/test/java/ghidrassist/hardware/HardwareVectorResetCorrelationSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareResetHandlerWitnessSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareResetEffectSitesSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareDecodedEffectSitesSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareMovecDirectionEvidenceSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareCallEffectsSelfTest.java
          java -ea -cp "$RUNNER_TEMP/vector-reset-tests" \
            ghidrassist.hardware.HardwareVectorResetCorrelationSelfTest
          java -ea -cp "$RUNNER_TEMP/vector-reset-tests" \
            ghidrassist.hardware.HardwareCallEffectsSelfTest
          java -ea -cp "$RUNNER_TEMP/vector-reset-tests" \
            ghidrassist.hardware.HardwareResetHandlerWitnessSelfTest
          java -ea -cp "$RUNNER_TEMP/vector-reset-tests" \
            ghidrassist.hardware.HardwareResetEffectSitesSelfTest
          java -ea -cp "$RUNNER_TEMP/vector-reset-tests" \
            ghidrassist.hardware.HardwareDecodedEffectSitesSelfTest

          java -ea -cp "$RUNNER_TEMP/vector-reset-tests" \
            ghidrassist.hardware.HardwareMovecDirectionEvidenceSelfTest
