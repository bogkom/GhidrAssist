name: GA-01/02/03/11 static vector/RESET correlation regressions

on:
  push:
    branches: [master]
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareVectorResetCorrelation.java'
      - 'src/main/java/ghidrassist/hardware/HardwareResetHandlerWitness.java'
      - 'src/main/java/ghidrassist/hardware/HardwareResetEffectSites.java'
      - 'src/main/java/ghidrassist/hardware/HardwareDecodedEffectSites.java'
      - 'src/main/java/ghidrassist/hardware/HardwareGhidraEffectSiteDecoder.java'
      - 'src/main/java/ghidrassist/hardware/HardwareResetFlow.java'
      - 'src/main/java/ghidrassist/hardware/HardwareCallEffects.java'
      - 'src/test/java/ghidrassist/hardware/HardwareVectorResetCorrelationSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareResetHandlerWitnessSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareResetEffectSitesSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareDecodedEffectSitesSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareCallEffectsSelfTest.java'
      - '.github/workflows/hardware-vector-reset-correlation.yml'
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareVectorResetCorrelation.java'
      - 'src/main/java/ghidrassist/hardware/HardwareResetHandlerWitness.java'
      - 'src/main/java/ghidrassist/hardware/HardwareResetEffectSites.java'
      - 'src/main/java/ghidrassist/hardware/HardwareDecodedEffectSites.java'
      - 'src/main/java/ghidrassist/hardware/HardwareGhidraEffectSiteDecoder.java'
      - 'src/main/java/ghidrassist/hardware/HardwareResetFlow.java'
      - 'src/main/java/ghidrassist/hardware/HardwareCallEffects.java'
      - 'src/test/java/ghidrassist/hardware/HardwareVectorResetCorrelationSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareResetHandlerWitnessSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareResetEffectSitesSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareDecodedEffectSitesSelfTest.java'
      - 'src/test/java/ghidrassist/hardware/HardwareCallEffectsSelfTest.java'
      - '.github/workflows/hardware-vector-reset-correlation.yml'

jobs:
  static-correlation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test pure-Java bounded graph/vector evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vector-reset-tests"
          javac --release 21 -d "$RUNNER_TEMP/vector-reset-tests" \
            src/main/java/ghidrassist/hardware/HardwareCallEffects.java \
            src/main/java/ghidrassist/hardware/HardwareResetFlow.java \
            src/main/java/ghidrassist/hardware/HardwareVectorResetCorrelation.java \
            src/main/java/ghidrassist/hardware/HardwareResetHandlerWitness.java \
            src/main/java/ghidrassist/hardware/HardwareResetEffectSites.java \
            src/main/java/ghidrassist/hardware/HardwareDecodedEffectSites.java \
            src/test/java/ghidrassist/hardware/HardwareVectorResetCorrelationSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareResetHandlerWitnessSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareResetEffectSitesSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareDecodedEffectSitesSelfTest.java \
            src/test/java/ghidrassist/hardware/HardwareCallEffectsSelfTest.java
          java -ea -cp "$RUNNER_TEMP/vector-reset-tests" \
            ghidrassist.hardware.HardwareVectorResetCorrelationSelfTest
          java -ea -cp "$RUNNER_TEMP/vector-reset-tests" \
            ghidrassist.hardware.HardwareCallEffectsSelfTest
          java -ea -cp "$RUNNER_TEMP/vector-reset-tests" \
            ghidrassist.hardware.HardwareResetHandlerWitnessSelfTest
          java -ea -cp "$RUNNER_TEMP/vector-reset-tests" \
            ghidrassist.hardware.HardwareResetEffectSitesSelfTest
          java -ea -cp "$RUNNER_TEMP/vector-reset-tests" \
            ghidrassist.hardware.HardwareDecodedEffectSitesSelfTest

