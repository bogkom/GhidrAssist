name: GA-11 real Ghidra 12.1.4 headless synthetic vectors
on:
  pull_request:
    paths:
      - 'tests/ga11_headless/**'
      - '.github/workflows/ga11-real-headless-vectors.yml'
      - 'src/main/java/ghidrassist/hardware/HardwareInterruptVectors.java'
      - 'src/main/java/ghidrassist/hardware/GhidraInterruptVectorService.java'
      - 'src/main/java/ghidrassist/hardware/GhidraHardwareFlowService.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-ghidra-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Fetch SHA-pinned Ghidra 12.1.4 PUBLIC
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 \
            -o "$RUNNER_TEMP/ghidra.zip" \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_DIR=$(find "$RUNNER_TEMP/ghidra" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' -print -quit)
          test -n "$GHIDRA_DIR"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
      - name: Compile full extension against actual Ghidra 12.1.4 PUBLIC
        shell: bash
        run: |
          set -euo pipefail
          "$GHIDRA_INSTALL_DIR/support/gradle/gradlew" --no-daemon buildExtension
          shopt -s nullglob
          zips=(dist/ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip)
          test "${#zips[@]}" -eq 1
          unzip -tq "${zips[0]}"
          sha256sum "${zips[0]}" > "$RUNNER_TEMP/extension.sha256"
          echo "EXTENSION=$PWD/${zips[0]}" >> "$GITHUB_ENV"
      - name: Exercise real Ghidra Program/FunctionManager and production flow headlessly
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/ga11_headless/run.py \
            --ghidra "$GHIDRA_INSTALL_DIR" --java-home "$JAVA_HOME" \
            --extension-zip "$EXTENSION" \
            --extension-sha256 "$(cut -d' ' -f1 "$RUNNER_TEMP/extension.sha256")" \
            --output "$RUNNER_TEMP/ga11-evidence"
      - name: Print bounded synthetic diagnostics on failure
        if: failure()
        shell: bash
        run: |
          for file in "$RUNNER_TEMP"/ga11-evidence/{compile,integration,vectors-full.bin.import,vectors-short.bin.import}.log; do
            if test -f "$file"; then
              echo "== $(basename "$file") =="
              tail -n 80 "$file"
            fi
          done
      - name: Upload isolated regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GA11-Real-Ghidra-Headless-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ga11-evidence/
            ${{ runner.temp }}/extension.sha256
          if-no-files-found: warn
          retention-days: 14
