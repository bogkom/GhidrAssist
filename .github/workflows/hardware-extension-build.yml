name: Hardware Analysis extension integration build

on:
  push:
    branches:
      - feature/hardware-analysis-seven-stages
    paths:
      - 'src/main/java/ghidrassist/hardware/**'
      - 'src/main/java/ghidrassist/ui/**'
      - 'src/main/java/ghidrassist/core/RAGPdfExtractor.java'
      - 'src/test/java/ghidrassist/hardware/**'
      - '.github/workflows/hardware-extension-build.yml'
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/**'
      - 'src/main/java/ghidrassist/ui/**'
      - 'src/main/java/ghidrassist/core/RAGPdfExtractor.java'
      - '.github/workflows/hardware-extension-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download exact Ghidra 12.1.4 distribution
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 \
            -o "$RUNNER_TEMP/ghidra.zip" \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_DIR=$(find "$RUNNER_TEMP/ghidra" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' -print -quit)
          test -n "$GHIDRA_DIR"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
      - name: Build complete GhidrAssist extension
        shell: bash
        run: |
          set -euo pipefail
          "$GHIDRA_INSTALL_DIR/support/gradle/gradlew" \
            --no-daemon --stacktrace buildExtension
