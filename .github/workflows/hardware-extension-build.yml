name: Hardware Analysis extension integration build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/hardware-analysis-seven-stages
      - feature/hardware-controlflow-rag-integration
      - codex/agentic-policy-and-evidence-fixes
    paths:
      - 'src/main/java/ghidrassist/hardware/**'
      - 'src/main/java/ghidrassist/automation/**'
      - 'src/main/java/ghidrassist/agent/**'
      - 'src/main/java/ghidrassist/tools/**'
      - 'src/main/java/ghidrassist/ui/**'
      - 'src/main/java/ghidrassist/core/RAGPdfExtractor.java'
      - 'src/main/java/ghidrassist/core/RAGEngine.java'
      - 'src/main/java/ghidrassist/core/RAGExcerptSelector.java'
      - 'src/main/java/ghidrassist/core/QueryProcessor.java'
      - 'src/main/java/ghidrassist/core/TabController.java'
      - 'src/main/resources/rag_cpu32_downloader.py'
      - 'src/main/java/ghidrassist/services/QueryService.java'
      - 'src/main/java/ghidrassist/apiprovider/OpenAIOAuthProvider.java'
      - 'src/test/java/ghidrassist/hardware/**'
      - '.github/workflows/hardware-extension-build.yml'
      - 'tools/ghidrassist-agent'
      - 'tools/ci/ghidra-gradle-ci-network.sh'
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/**'
      - 'src/main/java/ghidrassist/automation/**'
      - 'src/main/java/ghidrassist/agent/**'
      - 'src/main/java/ghidrassist/tools/**'
      - 'src/main/java/ghidrassist/ui/**'
      - 'src/main/java/ghidrassist/core/RAGPdfExtractor.java'
      - 'src/main/java/ghidrassist/core/RAGEngine.java'
      - 'src/main/java/ghidrassist/core/RAGExcerptSelector.java'
      - 'src/main/java/ghidrassist/core/QueryProcessor.java'
      - 'src/main/java/ghidrassist/core/TabController.java'
      - 'src/main/resources/rag_cpu32_downloader.py'
      - 'src/main/java/ghidrassist/services/QueryService.java'
      - 'src/main/java/ghidrassist/apiprovider/OpenAIOAuthProvider.java'
      - '.github/workflows/hardware-extension-build.yml'
      - 'tools/ghidrassist-agent'
      - 'tools/ci/ghidra-gradle-ci-network.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download exact Ghidra 12.1.4 distribution
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 \
            -o "$RUNNER_TEMP/ghidra.zip" \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_DIR=$(find "$RUNNER_TEMP/ghidra" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' -print -quit)
          test -n "$GHIDRA_DIR"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
      - name: Build complete GhidrAssist extension
        shell: bash
        run: |
          set -euo pipefail
          # Ghidra ZIP SHA was checked before extraction; only the ephemeral
          # CI Gradle wrapper network policy is changed, not Java/plugin code.
          bash tools/ci/ghidra-gradle-ci-network.sh "$GHIDRA_INSTALL_DIR"
          "$GHIDRA_INSTALL_DIR/support/gradle/gradlew" \
            --no-daemon --stacktrace buildExtension
      - name: Verify production interprocedural traversal in real Ghidra 12.1.4 (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate-synthetic-callgraph.py --output "$RUNNER_TEMP/synthetic-callgraph.bin"
          package="$(find dist -maxdepth 1 -type f -name 'ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip' -print -quit)"
          test -n "$package"
          unzip -p "$package" GhidrAssist/lib/GhidrAssist.jar > "$RUNNER_TEMP/ga18-product.jar"
          mkdir -p "$RUNNER_TEMP/ga18-headless"
          JAVA_TOOL_OPTIONS="-Dga18.test.jar=$RUNNER_TEMP/ga18-product.jar" \
            "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" \
            "$RUNNER_TEMP/ga18-headless" GA18GraphCI \
            -import "$RUNNER_TEMP/synthetic-callgraph.bin" \
            -loader BinaryLoader -processor 68000:BE:32:CPU32 -cspec default \
            -noanalysis -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" \
            -postScript GA18BootstrapSyntheticCallgraph.java \
            -postScript GA18VerifySyntheticCallgraph.java \
            -postScript GA18VerifyAutomationPaths.java \
            -postScript GA18VerifyVectorResetCorrelation.java \
            -postScript GA18VerifyDecompilerTaskBinding.java \
            -postScript GA18VerifyListingSnapshot.java \
            -postScript GA18VerifyListingRangeAndBodyXrefs.java \
            > "$RUNNER_TEMP/ga18-paths.log" 2>&1 || {
              tail -n 100 "$RUNNER_TEMP/ga18-paths.log"; exit 1;
            }
          # Expose only the generated synthetic script checks in the Actions log.
          # Ghidra's headless script runner can log Java-script exceptions
          # without a nonzero process exit; always surface an assertion failure.
          grep -E 'GA18 (CALLGRAPH|PRODUCTION PATHS|VECTOR RESET|DECOMPILER TASK|LISTING)|ERROR|Exception' "$RUNNER_TEMP/ga18-paths.log" || true
          grep -q 'GA18 CALLGRAPH PASS: functions=20 edges=19 mmio_static_writes=4 reset_reachable=6 assertions=110' "$RUNNER_TEMP/ga18-paths.log"
          grep -q 'GA18 PRODUCTION PATHS PASS: assertions=22' "$RUNNER_TEMP/ga18-paths.log"
          if ! grep -q 'GA18 VECTOR RESET CORRELATION PASS: assertions=13' "$RUNNER_TEMP/ga18-paths.log"; then
            echo 'Native synthetic vector/RESET correlation evidence missing'
            tail -n 120 "$RUNNER_TEMP/ga18-paths.log"
            exit 1
          fi
          grep -q 'GA18 REAL IMAGE-ZERO MCU24 ISR SOURCE PASS: selected=OUTSIDE generic=UNMAPPED' "$RUNNER_TEMP/ga18-paths.log"
          grep -q 'GA18 RESET INDIRECT MM VBR PASS: selected-device gate, bounded same-Program evidence, no hardware execution claim' "$RUNNER_TEMP/ga18-paths.log"
          grep -q 'GA18 DECOMPILER TASK BINDING PASS: assertions=7' "$RUNNER_TEMP/ga18-paths.log"
          grep -q 'GA18 LISTING SNAPSHOT PASS: assertions=9' "$RUNNER_TEMP/ga18-paths.log"
          grep -q 'GA18 LISTING RANGE BODY XREF PASS:' "$RUNNER_TEMP/ga18-paths.log"
          echo 'Real Ghidra native synthetic graph and production traversal assertions passed'
      - name: GA-01/02/03/11 genuine CPU32 Listing CFG branch and cycle route regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate-synthetic-cfg-routes.py --output "$RUNNER_TEMP/synthetic-cfg-routes.bin"
          test -s "$RUNNER_TEMP/ga18-product.jar"
          mkdir -p "$RUNNER_TEMP/ga18-native-cfg"
          JAVA_TOOL_OPTIONS="-Dga18.test.jar=$RUNNER_TEMP/ga18-product.jar" \
            "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" \
            "$RUNNER_TEMP/ga18-native-cfg" GA18NativeCfgCI \
            -import "$RUNNER_TEMP/synthetic-cfg-routes.bin" \
            -loader BinaryLoader -processor 68000:BE:32:CPU32 -cspec default \
            -noanalysis -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" \
            -postScript GA18VerifyNativeCfgSiteRoutes.java \
            > "$RUNNER_TEMP/ga18-native-cfg.log" 2>&1 || {
              tail -n 120 "$RUNNER_TEMP/ga18-native-cfg.log"; exit 1;
            }
          if ! grep -q 'GA18 NATIVE CFG SITE ROUTES PASS: assertions=' "$RUNNER_TEMP/ga18-native-cfg.log"; then
            echo 'Real Ghidra CPU32 native branch/cycle route regression missing'
            tail -n 120 "$RUNNER_TEMP/ga18-native-cfg.log"
            exit 1
          fi
          grep 'GA18 NATIVE CFG SITE ROUTES PASS:' "$RUNNER_TEMP/ga18-native-cfg.log"
      - name: GA-01/02/03/11 real RESET / computed JSR / MOVEC joint-source regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate-synthetic-reset-indirect-vbr.py \
            --output "$RUNNER_TEMP/synthetic-reset-indirect-vbr.bin"
          test -s "$RUNNER_TEMP/ga18-product.jar"
          mkdir -p "$RUNNER_TEMP/ga18-reset-indirect-vbr"
          JAVA_TOOL_OPTIONS="-Dga18.test.jar=$RUNNER_TEMP/ga18-product.jar" \
            "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" \
            "$RUNNER_TEMP/ga18-reset-indirect-vbr" GA18ResetIndirectVbrCI \
            -import "$RUNNER_TEMP/synthetic-reset-indirect-vbr.bin" \
            -loader BinaryLoader -processor 68000:BE:32:CPU32 -cspec default \
            -noanalysis -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" \
            -postScript GA18VerifyResetIndirectVbrJointSource.java \
            > "$RUNNER_TEMP/ga18-reset-indirect-vbr.log" 2>&1 || {
              tail -n 120 "$RUNNER_TEMP/ga18-reset-indirect-vbr.log"; exit 1;
            }
          if ! grep -q 'GA18 REAL RESET JSR MOVEC JOINT PASS: assertions=' \
              "$RUNNER_TEMP/ga18-reset-indirect-vbr.log"; then
            echo 'Native RESET JSR MOVEC production joint-source evidence missing'
            tail -n 120 "$RUNNER_TEMP/ga18-reset-indirect-vbr.log"
            exit 1
          fi
          grep -q 'GA18 REAL JOINT REVISION REFUSAL PASS: injected=2 unresolved=1' \
            "$RUNNER_TEMP/ga18-reset-indirect-vbr.log"
          grep -q 'GA18 REAL JOINT SOURCE PAGE PASS: pairs=2 pages=2 stale_epoch=1' \
            "$RUNNER_TEMP/ga18-reset-indirect-vbr.log"
          grep 'GA18 REAL RESET JSR MOVEC JOINT PASS:' \
            "$RUNNER_TEMP/ga18-reset-indirect-vbr.log"
      - name: Real Ghidra 12.1.4 convergent CALL path regression (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate-synthetic-convergent.py --output "$RUNNER_TEMP/synthetic-convergent.bin"
          test -s "$RUNNER_TEMP/synthetic-convergent.json"
          package="$(find dist -maxdepth 1 -name 'ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip' -type f -print -quit)"
          test -n "$package"
          unzip -p "$package" GhidrAssist/lib/GhidrAssist.jar > "$RUNNER_TEMP/ga18-convergent-product.jar"
          mkdir -p "$RUNNER_TEMP/ga18-convergent-headless"
          JAVA_TOOL_OPTIONS="-Dga18.test.jar=$RUNNER_TEMP/ga18-convergent-product.jar" \
            "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" \
            "$RUNNER_TEMP/ga18-convergent-headless" GA18ConvergentCI \
            -import "$RUNNER_TEMP/synthetic-convergent.bin" \
            -loader BinaryLoader -processor 68000:BE:32:CPU32 -cspec default \
            -noanalysis -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" \
            -postScript GA18BootstrapSyntheticConvergent.java \
            -postScript GA18VerifySyntheticConvergent.java \
            > "$RUNNER_TEMP/ga18-convergent.log" 2>&1 || {
              tail -n 120 "$RUNNER_TEMP/ga18-convergent.log"; exit 1;
            }
          grep -q 'GA18 CONVERGENT BOOTSTRAP PASS: functions=4' "$RUNNER_TEMP/ga18-convergent.log"
          grep -q 'GA18 CONVERGENT PATHS PASS: assertions=31 paths=2 shared_mmio_writes=1' "$RUNNER_TEMP/ga18-convergent.log"
      - name: Real Ghidra 12.1.4 unknown indirect CALL regression (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate-synthetic-indirect.py --output "$RUNNER_TEMP/synthetic-indirect.bin"
          package="$(find dist -maxdepth 1 -type f -name 'ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip' -print -quit)"
          test -n "$package"
          unzip -p "$package" GhidrAssist/lib/GhidrAssist.jar > "$RUNNER_TEMP/ga18-indirect-product.jar"
          mkdir -p "$RUNNER_TEMP/ga18-indirect-headless"
          JAVA_TOOL_OPTIONS="-Dga18.test.jar=$RUNNER_TEMP/ga18-indirect-product.jar" \
            "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" \
            "$RUNNER_TEMP/ga18-indirect-headless" GA18IndirectCI \
            -import "$RUNNER_TEMP/synthetic-indirect.bin" \
            -loader BinaryLoader -processor 68000:BE:32:CPU32 -cspec default \
            -noanalysis -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" \
            -postScript GA18BootstrapSyntheticIndirect.java \
            -postScript GA18VerifySyntheticIndirect.java \
            > "$RUNNER_TEMP/ga18-indirect.log" 2>&1 || {
              tail -n 120 "$RUNNER_TEMP/ga18-indirect.log"; exit 1;
            }
          grep -q 'GA18 INDIRECT BOOTSTRAP PASS: functions=2' "$RUNNER_TEMP/ga18-indirect.log"
          grep -q 'GA18 INDIRECT PATHS PASS: assertions=13 unresolved=1 no_guessed_paths=1' "$RUNNER_TEMP/ga18-indirect.log"
      - name: Real Ghidra 12.1.4 proven indirect constant CALL regression (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate-synthetic-indirect-constant.py --output "$RUNNER_TEMP/synthetic-indirect-constant.bin"
          package="$(find dist -maxdepth 1 -type f -name 'ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip' -print -quit)"
          test -n "$package"
          unzip -p "$package" GhidrAssist/lib/GhidrAssist.jar > "$RUNNER_TEMP/ga18-indirect-constant-product.jar"
          mkdir -p "$RUNNER_TEMP/ga18-indirect-constant-headless"
          JAVA_TOOL_OPTIONS="-Dga18.test.jar=$RUNNER_TEMP/ga18-indirect-constant-product.jar" \
            "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" \
            "$RUNNER_TEMP/ga18-indirect-constant-headless" GA18IndirectConstantCI \
            -import "$RUNNER_TEMP/synthetic-indirect-constant.bin" \
            -loader BinaryLoader -processor 68000:BE:32:CPU32 -cspec default \
            -noanalysis -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" \
            -postScript GA18BootstrapSyntheticIndirectConstant.java \
            -postScript GA18VerifySyntheticIndirectConstant.java \
            > "$RUNNER_TEMP/ga18-indirect-constant.log" 2>&1 || {
              tail -n 120 "$RUNNER_TEMP/ga18-indirect-constant.log"; exit 1;
            }
          grep -q 'GA18 INDIRECT CONSTANT BOOTSTRAP PASS: functions=2' "$RUNNER_TEMP/ga18-indirect-constant.log"
          grep -q 'GA18 INDIRECT CONSTANT PROVENANCE PASS: assertions=16 fallback=1 ghidra_reference=1 rollback=1' "$RUNNER_TEMP/ga18-indirect-constant.log"
      - name: Real Ghidra 12.1.4 bounded CPU32 register-flow regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate-synthetic-register-flow.py --output "$RUNNER_TEMP/synthetic-register-flow.bin"
          package="$(find dist -maxdepth 1 -type f -name 'ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip' -print -quit)"
          test -n "$package"
          unzip -p "$package" GhidrAssist/lib/GhidrAssist.jar > "$RUNNER_TEMP/ga18-register-flow.jar"
          mkdir -p "$RUNNER_TEMP/ga18-register-flow-headless"
          JAVA_TOOL_OPTIONS="-Dga18.test.jar=$RUNNER_TEMP/ga18-register-flow.jar" \
            "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" \
            "$RUNNER_TEMP/ga18-register-flow-headless" GA18RegisterFlowCI \
            -import "$RUNNER_TEMP/synthetic-register-flow.bin" \
            -loader BinaryLoader -processor 68000:BE:32:CPU32 -cspec default \
            -noanalysis -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" \
            -postScript GA18BootstrapSyntheticRegisterFlow.java \
            -postScript GA18VerifySyntheticRegisterFlow.java \
            > "$RUNNER_TEMP/ga18-register-flow.log" 2>&1 || {
              tail -n 130 "$RUNNER_TEMP/ga18-register-flow.log"; exit 1;
            }
          tail -n 100 "$RUNNER_TEMP/ga18-register-flow.log"
          grep -q 'GA18 REGISTER FLOW BOOTSTRAP PASS: functions=4' "$RUNNER_TEMP/ga18-register-flow.log"
          grep -q 'GA18 REGISTER FLOW PASS: assertions=20 nop=1 clobber=1 branch=1 rollback=1' "$RUNNER_TEMP/ga18-register-flow.log"
      - name: Real Ghidra 12.1.4 MOVEQ-safe register-flow and conditional branch barriers
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate-synthetic-moveq-flow.py --output "$RUNNER_TEMP/synthetic-moveq-flow.bin"
          package="$(find dist -maxdepth 1 -type f -name 'ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip' -print -quit)"
          test -n "$package"
          unzip -p "$package" GhidrAssist/lib/GhidrAssist.jar > "$RUNNER_TEMP/ga18-moveq-flow.jar"
          mkdir -p "$RUNNER_TEMP/ga18-moveq-flow-headless"
          JAVA_TOOL_OPTIONS="-Dga18.test.jar=$RUNNER_TEMP/ga18-moveq-flow.jar" \
            "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" \
            "$RUNNER_TEMP/ga18-moveq-flow-headless" GA18MoveqCI \
            -import "$RUNNER_TEMP/synthetic-moveq-flow.bin" \
            -loader BinaryLoader -processor 68000:BE:32:CPU32 -cspec default \
            -noanalysis -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" \
            -postScript GA18BootstrapSyntheticMoveqFlow.java \
            -postScript GA18VerifySyntheticMoveqFlow.java \
            > "$RUNNER_TEMP/ga18-moveq-flow.log" 2>&1 || {
              tail -n 120 "$RUNNER_TEMP/ga18-moveq-flow.log"; exit 1;
            }
          tail -n 45 "$RUNNER_TEMP/ga18-moveq-flow.log"
          grep -q 'GA18 MOVEQ FLOW BOOTSTRAP PASS: functions=4' "$RUNNER_TEMP/ga18-moveq-flow.log"
          grep -q 'GA18 MOVEQ FLOW PASS: assertions=20 moveq=1 clobber=1 conditional_branch=1 rollback=1' "$RUNNER_TEMP/ga18-moveq-flow.log"
      - name: Verify ZIP and record SHA-256
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip)
          if (( ${#packages[@]} != 1 )); then
            echo "::error::Expected exactly one GhidrAssist extension ZIP in dist/; found ${#packages[@]}"
            exit 1
          fi
          unzip -tq "${packages[0]}"
          mapfile -t roots < <(unzip -Z1 "${packages[0]}" | awk -F/ 'NF {print $1}' | sort -u)
          test "${#roots[@]}" -eq 1 && test "${roots[0]}" = GhidrAssist
          unzip -p "${packages[0]}" GhidrAssist/extension.properties > "$RUNNER_TEMP/extension.properties"
          grep -Fxq 'version=12.1.4' "$RUNNER_TEMP/extension.properties"
          test "$(unzip -Z1 "${packages[0]}" | grep -Fx 'GhidrAssist/lib/GhidrAssist.jar')" = GhidrAssist/lib/GhidrAssist.jar
          mkdir -p "$RUNNER_TEMP/install-check"
          unzip -q "${packages[0]}" -d "$RUNNER_TEMP/install-check"
          test -f "$RUNNER_TEMP/install-check/GhidrAssist/extension.properties"
          test -f "$RUNNER_TEMP/install-check/GhidrAssist/lib/GhidrAssist.jar"
          jar tf "$RUNNER_TEMP/install-check/GhidrAssist/lib/GhidrAssist.jar" | grep -Fxq 'ghidrassist/apiprovider/APIProvider.class'
          ( cd dist && sha256sum "$(basename "${packages[0]}")" > SHA256SUMS.txt )
          ( cd dist && sha256sum -c SHA256SUMS.txt )
          printf 'Extension package: %s\n' "${packages[0]}"
          ls -lh "${packages[0]}" dist/SHA256SUMS.txt
      - name: Assert CPU32 downloader resource is in the installable extension
        shell: bash
        run: |
          set -euo pipefail
          package="$(find dist -maxdepth 1 -type f -name 'ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip' -print -quit)"
          test -n "$package"
          found=0
          while IFS= read -r member; do
            [[ "$member" == *GhidrAssist*.jar ]] || continue
            unzip -p "$package" "$member" > "$RUNNER_TEMP/GhidrAssist-packaged.jar"
            if jar tf "$RUNNER_TEMP/GhidrAssist-packaged.jar" \
                | grep -Fxq 'rag_cpu32_downloader.py'; then
              echo "Downloader resource packaged in $member"
              found=1
              break
            fi
          done < <(unzip -Z1 "$package")
          test "$found" -eq 1
      # upload-artifact already wraps these files in the downloaded artifact ZIP.
      # Do not create a second distribution ZIP: the inner ZIP is installed by Ghidra.
      - name: Publish installable extension ZIP (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: GhidrAssist-Ghidra-12.1.4-${{ github.run_id }}
          path: |
            dist/ghidra_12.1.4_PUBLIC_*_GhidrAssist.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
