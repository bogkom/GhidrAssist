name: Hardware CFG candidate write path relations

on:
  push:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareCfgStorePaths.java'
      - 'src/main/java/ghidrassist/hardware/GhidraHardwareFlowService.java'
      - 'src/test/java/ghidrassist/hardware/HardwareCfgStorePathsSelfTest.java'
      - '.github/workflows/hardware-cfg-store-paths.yml'
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareCfgStorePaths.java'
      - 'src/main/java/ghidrassist/hardware/GhidraHardwareFlowService.java'
      - 'src/test/java/ghidrassist/hardware/HardwareCfgStorePathsSelfTest.java'
      - '.github/workflows/hardware-cfg-store-paths.yml'
  workflow_dispatch:

jobs:
  paths:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile bounded CFG path relation model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cfg-paths"
          javac --release 21 -d "$RUNNER_TEMP/cfg-paths" \
            src/main/java/ghidrassist/hardware/HardwareCfgStorePaths.java \
            src/test/java/ghidrassist/hardware/HardwareCfgStorePathsSelfTest.java
      - name: Reject false path feasibility or hardware-order claims
        run: java -cp "$RUNNER_TEMP/cfg-paths" ghidrassist.hardware.HardwareCfgStorePathsSelfTest
