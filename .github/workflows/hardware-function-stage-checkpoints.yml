name: GA-12 per-function completed CFG checkpoint regressions
on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareFunctionStageCache.java'
      - 'src/main/java/ghidrassist/hardware/GhidraHardwareFlowService.java'
      - 'src/main/java/ghidrassist/hardware/HardwareFlowStageCache.java'
      - 'src/test/java/ghidrassist/hardware/HardwareFunctionStageCacheSelfTest.java'
      - '.github/workflows/hardware-function-stage-checkpoints.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile deterministic pure-Java fixed-point checkpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga12-functions"
          javac --release 21 -d "$RUNNER_TEMP/ga12-functions" \
            src/main/java/ghidrassist/hardware/HardwareDataflow.java \
            src/main/java/ghidrassist/hardware/HardwareStageEpochs.java \
            src/main/java/ghidrassist/hardware/HardwareFunctionStageCache.java \
            src/test/java/ghidrassist/hardware/HardwareFunctionStageCacheSelfTest.java
          java -cp "$RUNNER_TEMP/ga12-functions" \
            ghidrassist.hardware.HardwareFunctionStageCacheSelfTest
