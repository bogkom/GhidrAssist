name: GA-06 external MCU profile manifest discrepancy tests
on:
  push:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareProfileManifestPreview.java'
      - 'src/main/java/ghidrassist/hardware/HardwareProfileManifestComparison.java'
      - 'src/main/java/ghidrassist/ui/tabs/HardwareAnalysisTab.java'
      - 'src/test/java/ghidrassist/hardware/HardwareProfileManifestComparisonSelfTest.java'
      - '.github/workflows/hardware-profile-comparison.yml'
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareProfileManifestPreview.java'
      - 'src/main/java/ghidrassist/hardware/HardwareProfileManifestComparison.java'
      - 'src/main/java/ghidrassist/ui/tabs/HardwareAnalysisTab.java'
      - 'src/test/java/ghidrassist/hardware/HardwareProfileManifestComparisonSelfTest.java'
      - '.github/workflows/hardware-profile-comparison.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile strict read-only manifest comparison
        run: |
          mkdir -p "$RUNNER_TEMP/profile-diff"
          javac --release 21 -d "$RUNNER_TEMP/profile-diff" \
            src/main/java/ghidrassist/hardware/HardwareProfileManifestPreview.java \
            src/main/java/ghidrassist/hardware/HardwareProfileManifestComparison.java \
            src/test/java/ghidrassist/hardware/HardwareProfileManifestComparisonSelfTest.java
      - name: Validate names, widths, bitfields, source pages, omission and boundedness
        run: java -cp "$RUNNER_TEMP/profile-diff" ghidrassist.hardware.HardwareProfileManifestComparisonSelfTest
