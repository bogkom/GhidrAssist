name: GA-02/03 interprocedural CALL-site SIMCR candidate analysis
on:
  pull_request:
    paths:
      - 'src/main/java/ghidrassist/hardware/HardwareInterproceduralMmEffects.java'
      - 'src/test/java/ghidrassist/hardware/HardwareInterproceduralMmEffectsSelfTest.java'
      - 'src/main/java/ghidrassist/hardware/GhidraHardwareFlowService.java'
      - '.github/workflows/hardware-interprocedural-mm-callsite.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and verify bounded static interprocedural CALL effects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga0203"
          javac --release 21 -d "$RUNNER_TEMP/ga0203" \
            src/main/java/ghidrassist/hardware/HardwareInterproceduralMmEffects.java \
            src/test/java/ghidrassist/hardware/HardwareInterproceduralMmEffectsSelfTest.java
          java -cp "$RUNNER_TEMP/ga0203" \
            ghidrassist.hardware.HardwareInterproceduralMmEffectsSelfTest
